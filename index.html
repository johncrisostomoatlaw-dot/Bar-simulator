<title>Philippine Bar Simulator</title>

<style>
/* Layout: one centred examination desk; subject board → answer booklet → examiner's report */
:root {
  --bg: #eef1f5; --surface: #ffffff; --ink: #17202d; --muted: #5a6577; --rule: #d6dce5;
  --accent: #7b1e2b; --accent-ink: #ffffff; --gold: #9c7a22; --line: #e3e8ef;
  --good: #1f7a4d; --warn: #a3620a; --bad: #b42323; --soft: #f5f7fa;
  --f-display: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e131b; --surface: #161d28; --ink: #e5e9f0; --muted: #98a3b5; --rule: #2a3444;
  --accent: #d86474; --accent-ink: #1a0f12; --gold: #d4b25a; --line: #222b39;
  --good: #4cc08a; --warn: #e3a344; --bad: #f07272; --soft: #1b2331; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e131b; --surface: #161d28; --ink: #e5e9f0; --muted: #98a3b5; --rule: #2a3444;
  --accent: #d86474; --accent-ink: #1a0f12; --gold: #d4b25a; --line: #222b39;
  --good: #4cc08a; --warn: #e3a344; --bad: #f07272; --soft: #1b2331; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px }
.wrap { max-width: 960px; margin: 0 auto }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; line-height: 1.25 }
h1 { font-size: clamp(1.7rem, 4vw, 2.3rem) }
h2 { font-size: 1.35rem }
h3 { font-size: 1.05rem }
p { margin: 0 }
.label { font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.muted { color: var(--muted) }
button, select { font: inherit }
button { cursor: pointer; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); padding: 8px 14px; font-weight: 600 }
button:hover { border-color: var(--muted) }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
button.primary:hover { filter: brightness(1.08) }
button:disabled { opacity: .5; cursor: not-allowed }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
select, input[type=number] { background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 10px }

/* Masthead */
.mast { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px; padding-block: 28px 20px; border-bottom: 3px double var(--rule); margin-bottom: 24px }
.mast .seal { font-family: var(--f-display); font-style: italic; color: var(--gold) }

/* Board */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px }
.subj { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.subj .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
.weight { font-family: var(--f-mono); font-weight: 700; color: var(--accent); font-size: 1.1rem }
.subj .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; flex-wrap: wrap }
.pill { display: inline-block; font-size: .75rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; border: 1px solid currentColor; font-variant-numeric: tabular-nums }
.pill.good { color: var(--good) } .pill.bad { color: var(--bad) } .pill.idle { color: var(--muted) } .pill.warn { color: var(--warn) }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 18px }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center }
.settings { display: flex; flex-wrap: wrap; gap: 18px; align-items: end; margin-bottom: 22px }
.settings label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; font-weight: 600 }
.settings .check { flex-direction: row; align-items: center; gap: 8px; padding-bottom: 8px }
.card-score { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; margin-bottom: 24px }
.big { font-family: var(--f-mono); font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1 }
.bar { height: 8px; background: var(--line); border-radius: 99px; position: relative; overflow: hidden }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px }
.bar > b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--gold); left: 75% }

/* Exam */
.examhead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--rule); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px }
.timer { font-family: var(--f-mono); font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em }
.timer.low { color: var(--bad) }
.nav { display: flex; flex-wrap: wrap; gap: 6px; margin-block: 16px }
.nav button { width: 40px; padding: 6px 0; font-family: var(--f-mono); position: relative }
.nav button.cur { border-color: var(--accent); color: var(--accent) }
.nav button.done::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--good) }
.nav button.flag { border-style: dashed; border-color: var(--gold) }
.qtext { font-family: var(--f-display); font-size: 1.08rem; line-height: 1.7; max-width: 68ch; white-space: pre-line }
.booklet { width: 100%; min-height: 340px; resize: vertical; border: 1px solid var(--rule); border-radius: 6px; padding: 6px 14px; color: var(--ink);
  font: 16px/32px var(--f-display); background-color: var(--surface);
  background-image: linear-gradient(var(--surface) 0 31px, var(--line) 31px 32px); background-size: 100% 32px; background-attachment: local; background-position: 0 6px }
.meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums }
.warnbox { border: 1px solid var(--warn); color: var(--warn); border-radius: 6px; padding: 8px 12px; font-size: .9rem }
.confirm { border: 1px solid var(--accent); border-radius: 8px; padding: 14px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between }

/* Report */
.qres { border-top: 1px solid var(--rule); padding-block: 18px; display: flex; flex-direction: column; gap: 10px }
.qres .hd { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap }
.answer { background: var(--soft); border-radius: 6px; padding: 10px 14px; font-family: var(--f-display); white-space: pre-wrap; max-height: 260px; overflow: auto; min-width: 0 }
details { border: 1px solid var(--rule); border-radius: 6px; padding: 8px 12px }
summary { cursor: pointer; font-weight: 600 }
.key { font-size: .93rem; margin-top: 6px; white-space: pre-line }
.grade { border-left: 3px solid var(--gold); padding: 4px 0 4px 14px; display: flex; flex-direction: column; gap: 6px; white-space: pre-wrap }
.grade ul { margin: 0; padding-left: 20px }
.score-in { width: 80px }
.feedback { display: flex; flex-direction: column; gap: 12px; border-color: var(--gold) }
.reg { display: flex; flex-direction: column; gap: 6px }
.reg ul { margin: 0; padding-left: 20px }
.small { font-size: .85rem }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .5s ease } }
</style>

const BANK = {
  // 2025 Bar Examinations, Political and Public International Law: questions and the UP Bar Review Institute's suggested answers.
  pol: [
    {
      "pts": 5,
      "q": "ABC Construction Company was engaged by XYZ Group Inc. to build an eight-storey building with a height of 34.4 meters located behind the intended new airport in Bulacan. A month later, Ordinance No. 12345 was passed by the Sangguniang Panlalawigan of Bulacan, setting the height limit on the buildings to be constructed along the new airport to five storeys or a maximum height of 21.5 meters. After building five storeys, ABC Construction Company served a notice on XYZ Group Inc. that it can no longer build the sixth, seventh, and eighth floors of the building in view of Ordinance No. 12345. XYZ Group Inc. consequently assailed Ordinance No. 12345 for allegedly violating the non-impairment clause of the Constitution. Will the case prosper? Reason(s).",
      "key": "No, the case will not prosper.\n\nThe non-impairment of contracts clause yields to the superior and legitimate exercise by the State of police power to promote the health, morals, peace, education, good order, safety, and general welfare of the people. Moreover, statutes in exercise of valid police power must be read into every contract.\n\nHere, Ordinance No. 12345 was passed to set height limits for buildings along new airports, evidently in the interest of public safety, and is an exercise of police power with which citizens and other affected persons are bound to comply. Being a valid exercise of police power, Ordinance No. 12345 cannot be said to violate the non-impairment clause. [Ortigas & Co. Ltd. v. Court of Appeals, G.R. No. 126102, Dec. 4, 2000; United BF Homeowner’s Association v. City Mayor, G.R. No. 141010, Feb. 7, 2007]",
      "origin": "2025 Bar · Political and Public International Law · Q1",
      "keyLabel": "UP BRI suggested answer",
      "kw": "non-impairment police power",
      "cases": [
        {
          "title": "Ortigas & Co. Ltd. v. Court of Appeals, G.R. No. 126102 (2000)",
          "url": "https://lawphil.net/judjuris/juri2000/dec2000/gr_126102_2000.html",
          "src": "lawphil"

        {
          "title": "United BF Homeowners Association v. City Mayor, G.R. No. 141010 (2007)",
          "url": "https://lawphil.net/judjuris/juri2007/feb2007/gr_141010_2007.html",

    {
      "pts": 5,
      "q": "The XYZ Church was a relatively new religious group with fast-growing membership. On January 22, 2025, ABC News published an investigative report revealing that the leader of XYZ Church, Father Z, was actually the head of an underground syndicate and a notorious swindler who was convicted of fraud charges in the United States of America. The published report caused great agitation to XYZ Church followers who threatened to harm ABC News, destroyed its properties, and mauled the vendors who were selling copies of its newspaper containing the report. Reacting to this spate of violence, Secretary of Justice X, on national television, prohibited ABC News and other newspapers from re-publishing the questioned report or they shall face charges in court. ABC News assailed the prohibition, claiming that the same constitutes prior restraint against speech. Is the challenge correct? Reason(s).",
      "key": "Yes, the challenge is correct.\n\nPrior restraints and content-based regulations bear a presumption of unconstitutionality: to be valid, (1) the restriction must pass the clear and present danger test, and (2) the incidental restriction on speech must be the least restrictive means available. [Chavez v. Gonzales, G.R. No. 168338, Feb. 15, 2008.] Such clear and present danger means that the speech must be directed at inciting or producing imminent lawless action. [Calleja v. Executive Secretary, G.R. No. 252578, Dec. 7, 2021]\n\nIn this case, the Secretary of Justice is not imposing sanctions for the already published investigative report but placing a prohibition on its re-publication. This effectively censors news outlets and threatens them with litigation, before they perform an action covered by the freedom of speech or the press, with relation to the expose on XYZ Church. Further, the report was not directed to inciting imminent lawless action, and even if it did result in a violent response from XYZ Church, the latter can be addressed without restricting the republication of the report, e.g., by prosecuting those who commit acts of violence. Hence, the Secretary of Justice’s prohibition is unconstitutional.",
      "origin": "2025 Bar · Political and Public International Law · Q2",

      "kw": "prior restraint",
      "cases": [
        {
          "title": "Chavez v. Gonzales, G.R. No. 168338 (2008)",
          "url": "https://lawphil.net/judjuris/juri2008/feb2008/gr_168338_2008.html",
          "src": "lawphil"
        },

          "title": "Calleja v. Executive Secretary, G.R. No. 252578 (2021)",
          "url": "https://lawphil.net/judjuris/juri2021/dec2021/gr_252578_2021.html",
          "src": "lawphil"
        }
      ]
    },
    {
      "pts": 5,
      "q": "The Congress submitted to the President, for his signature, the enrolled bill seeking to decriminalize adultery and concubinage. Immediately thereafter, members of the XYZ Partylist filed a petition for certiorari to nullify the enrolled bill for allegedly violating the due process clause since the same was passed by the Congress without the benefit of a public hearing. The Office of the Solicitor General (OSG) moved to dismiss the petition on the ground that there is yet no actual case to speak of. Is the OSG correct? Reason(s).",
      "key": "Yes, the OSG is correct.\n\nThe requisites of the exercise of the power of review are: (1) there must be an actual controversy; (2) the constitutionality of the issue is brought at the earliest opportunity; (3) the petitioner has legal standing to sue; (4) the issue of constitutionality is the very lis mota of the case.\n\nHere, the enrolled bill seeking to decriminalize adultery and concubinage was still under consideration of the President and has not been signed into law. Section 1 of Article VIII provides that judicial power includes the duty of the courts of justice to settle actual controversies involving rights which are legally demandable and enforceable, and to determine whether or not there has been a grave abuse of discretion amounting to lack or excess of jurisdiction on the part of any branch or instrumentality of the Government. Since there is no apparent justiciable issue, the petition must be dismissed. [See Montesclaros v. Commission on Elections, G.R. No. 152295, July 9, 2002]\n\nALTERNATIVE ANSWER:\n\nYes, the OSG is correct.\n\nA law may be validly enacted even assuming the absence of public consultation. The legislative process in the Constitution does not require such consultations, and hence the “[p]enalty for failure on the part of the government to consult could only be reflected in the ballot box and would not nullify government action.” [Council of Teachers v. Secretary of Education, G.R. No. 216930, Oct. 9, 2018]\n\nSince the absence of a public hearing would not nullify the enrolled bill, XYZ Partylist’s petition for certiorari is invalid.",
      "origin": "2025 Bar · Political and Public International Law · Q3",
      "keyLabel": "UP BRI suggested answer",
      "kw": "actual case controversy",
      "cases": [
        {
          "title": "Montesclaros v. COMELEC, G.R. No. 152295 (2002)",

          "src": "lawphil"
        },
        {
          "title": "Council of Teachers and Staff of Colleges and Universities v. Secretary of Education, G.R. No. 216930 (2018)",
          "url": "https://lawphil.net/judjuris/juri2018/oct2018/gr_216930_2018.html",
          "src": "lawphil"
        }
      ]
    },
    {
      "pts": 5,
      "q": "In 2022, A started an investment company while he was in France, during which, he allegedly embezzled funds amounting to EUR 25 million before absconding and returning to the Philippines in 2023 where he again was said to have acquired, through fraud, PHP 13 million from various investors. As a result, criminal proceedings in France were instituted against A in 2024. No similar criminal proceedings though were instituted in the Philippines. To legally try A for his crime, the French government sought the extradition of A to France, arguing that the Philippines had an obligation to either extradite or prosecute A. France argued that since the Philippines has not yet prosecuted A, it now has an obligation to extradite under international law despite the absence of an extradition treaty between France and the Philippines. Is France correct? Reason(s).",
      "key": "SUGGESTED ANSWER #1:\n\nNo, France is not correct.\n\nExtradition is an obligation that arises from treaty law, not customary international law. As the Supreme Court has previously held, “[t]he right of a state to successfully request the extradition of a criminal offender arises from a treaty with the requested state.” [Government of Hongkong-SAR v. Muñoz, G.R. No. 207342, Aug. 16, 2016]\n\nSince France does not have an extradition treaty with the Philippines, the Philippines has no obligation to extradite A. The choice between either extradition or prosecution which France asserts has no legal basis.\n\nSUGGESTED ANSWER #2:\n\nNo, France is wrong.\n\nWhile the obligation to extradite or prosecute may be a conventional or treaty obligation of states, there is no customary international obligation of aut dedere aut judicare. In any case, cases decided by the International Court of Justice only consider the customary obligation in those involving erga omnes obligations or those obligations owed to the international community as a whole.\n\nSince there is no extradition treaty, and prosecuting or extraditing a person charged with embezzlement is not an erga omnes obligation, the Philippines is not obliged to extradite person A.",
      "origin": "2025 Bar · Political and Public International Law · Q4",
      "keyLabel": "UP BRI suggested answer",
      "kw": "extradition treaty",
      "cases": [
        {

          "src": "lawphil"
        }

    },
    {
      "pts": 5,
      "q": "In 2014, A and B, both Filipino citizens, met at the XYZ Hospital in Taguig City where they both worked as nurses. After dating for a year, they got married. Eventually, A flew to the United States of America (USA) to work in a hospital in New York City. On the other hand, B continued working at the XYZ Hospital until he also got hired as a nurse in the same hospital where A was working in New York City. During A and B’s stay in the USA, A got naturalized as an American citizen and, later on, gave birth to their child, baby C, in 2024. Is baby C a Filipino citizen? Reason(s).",
      "key": "Yes, baby C is a Filipino citizen.\n\nUnder the Constitution, those whose father or mother is a citizen of the Philippines are themselves Filipino citizens, regardless of the place of birth. [Art. IV, Sec. 1(2)] This reflects the principle of jus sanguinis (citizenship by blood), which the Philippines adheres to and not jus soli (citizenship by birthplace). Philippine law further allows for dual citizenship, in cases where foreign law grants another citizenship to a Filipino.\n\nIn this case, although baby C was born in the United States in 2024, both A and B were Filipino citizens at the time of their marriage and migration. Here, while A was naturalized as an American citizen, B appears to remain a Filipino citizen notwithstanding his move to the United States. [See Commonwealth Act No. 63 (1936)] Therefore, baby C—being born to at least one Filipino parent—is considered a Filipino citizen from birth.",
      "origin": "2025 Bar · Political and Public International Law · Q5",
      "keyLabel": "UP BRI suggested answer",
      "kw": "citizenship jus sanguinis",
      "cases": [],
      "noCases": "The suggested answer cites no case; it rests on constitutional, statutory or procedural provisions."
    },
    {
      "pts": 5,
      "q": "On April 24, 2025, the Treaty of Copenhagen, an international agreement among various states fortifying their commitment to address climate change, was signed by the Secretary of Foreign Affairs as the duly authorized signatory of the Philippines. Thereafter, the treaty was transmitted to the President for ratification. After reviewing the terms of the treaty, the President decided not to ratify the same. Consequently, X, a passionate environmentalist, filed a petition for mandamus to compel the President to ratify and transmit the signed copy of the Treaty of Copenhagen to the Senate for its concurrence. Will the petition prosper? Reason(s).",
      "key": "No, the petition will not prosper.\n\nThe President is the chief architect of foreign policy. As such, he has the power to ratify a treaty, subject to the concurrence of the Senate. It is within his discretionary authority to refuse to submit a treaty to the Senate, or having secured its consent for its ratification, refuse to ratify it. [Pimentel v. Executive Secretary, G.R. No. 158088, July 6, 2005.] Meanwhile, mandamus is available to compel the performance of a ministerial act, or one that does not rest on the discretion of the respondent.\n\nThe transmittal of the Treaty of Copenhagen for Senate concurrence is within the executive discretion of the President and is not his ministerial duty. Therefore, the petition for mandamus will not prosper.",
      "origin": "2025 Bar · Political and Public International Law · Q6",
      "keyLabel": "UP BRI suggested answer",
      "kw": "treaty ratification mandamus",
      "cases": [
        {
          "title": "Pimentel v. Office of the Executive Secretary, G.R. No. 158088 (2005)",
          "url": "https://lawphil.net/judjuris/juri2005/jul2005/gr_158088_2005.html",
          "src": "lawphil"
        }
      ]
    },
    {
      "pts": 5,
      "q": "Given the increasing number of foreigners residing in ABC City, its Sangguniang Panlungsod issued Ordinance No. 0628, allowing foreigners who have resided for at least five years in the City to acquire ownership over parcels of land not exceeding 500 square meters. A concerned Filipino citizen residing in ABC City filed a petition for certiorari, challenging Ordinance No. 0628 for violating the constitutional prohibition against land ownership by foreigners. ABC City, on the other hand, argued that it was granted local autonomy within its jurisdiction and can therefore pass any ordinance it deems beneficial to its residents. Decide with reason(s).",
      "key": "Ordinance No. 0628 is unconstitutional.\n\nUnder the Constitution and insofar as individuals are concerned, only citizens of the Philippines may own land. [Art. XII, Secs. 3 & 7] Furthermore, one of the requisites for a valid ordinance is that it cannot violate the Constitution. [White Light v. City of Manila, G.R. No. 122846, Jan. 20, 2009] This is because “local government units, while empowered to enact local legislation for the general welfare of their constituents, remain mere agents of the State.” [City of Batangas v. JG Summit Petrochemical, G.R. No. 190266, Mar. 15, 2023]\n\nOrdinance No. 0628 cannot contradict the prohibition on foreign ownership of lands, for while the Constitution grants local governments autonomy, this autonomy cannot be interpreted to grant it powers beyond even what Congress, through the Local Government Code, or other laws, can delegate. In this case, Ordinance No. 0628 is a direct violation of provisions of the Constitution on land ownership and so must be struck down.",
      "origin": "2025 Bar · Political and Public International Law · Q7",
      "keyLabel": "UP BRI suggested answer",
      "kw": "foreign ownership of land ordinance",
      "cases": [
        {
          "title": "White Light Corp. v. City of Manila, G.R. No. 122846 (2009)",
          "url": "https://lawphil.net/judjuris/juri2009/jan2009/gr_122846_2009.html",
          "src": "lawphil"
        },
        {
          "title": "City of Batangas v. JG Summit Petrochemical Corp., G.R. Nos. 190266-67 (2023)",
          "url": "https://lawphil.net/judjuris/juri2023/mar2023/gr_190266-67_2023.html",
          "src": "lawphil"
        }

    },
    {
      "pts": 5,
      "q": "President X signed into law Republic Act No. 1213, which set fixed rates for the just compensation of properties across various regions of the Philippines in order to expedite the resolution of expropriation cases and to prevent lengthy and costly litigation. One of the affected landowners, Y, challenged the constitutionality of Republic Act No. 1213, asserting that the determination of just compensation is not a legislative function. The Republic of the Philippines, represented by the Office of the Solicitor General (OSG), countered that since expropriation is an exercise of the power of eminent domain belonging to the legislature, just compensation may be fixed by law. Decide with reason(s).",
      "key": "Y’s challenge is correct.\n\nThe determination of just compensation is a judicial function. [Export Processing Zone Authority v. Dulay, G.R. No. L-59603, Apr. 29, 1987] While Congress may provide formulas for the computation of just compensation, these are not binding on the courts.\n\nIn this case, Republic Act No. 1213 fixes compensation through set rates to expedite expropriation cases, removing the case-by-case valuation that should be performed by courts. Therefore, the method of ascertaining just compensation under the Republic Act No. 1213 constitutes an impermissible encroachment on judicial prerogatives.",
      "origin": "2025 Bar · Political and Public International Law · Q8",

        {

      "pts": 5,
      "q": "The Municipality of ABC passed Ordinance No. 1613, known as the “Speed Limit Ordinance.” It prescribed speed limits for all types of vehicles and penalties for violations thereof, such as a fine of PHP 1,000.00 for the first offense, PHP 1,500.00 for the second offense, and PHP 2,000.00 or 30-day imprisonment or both for the third offense. X, a resident of the Municipality of ABC, assailed the constitutionality of Ordinance No. 1613 because it was not published in a newspaper of general circulation, hence, violative of the due process clause. While the Municipality of ABC admitted there was no publication, it asserted that since Ordinance No. 1613 was posted in three conspicuous places, the requirement of due process was deemed satisfied. Decide with reason(s).",
      "key": "SUGGESTED ANSWER #1:\n\nX is correct that Ordinance No. 1613 is unconstitutional for violating the right to due process.\n\nThe “omission of publication of laws is tantamount to denying the public of knowledge and information of the laws that govern it; hence, a violation of due process.” [Villafuerte v. Cordial, G.R. No. 222450, July 7, 2020] Notably, under Section 511 of the Local Government Code, ordinances with penal sanctions “shall also be published in a newspaper of general circulation, where available, within the territorial jurisdiction of the local government unit concerned, except in the case of barangay ordinances.”\n\nHere, while the Municipality of ABC posted the ordinances, the Ordinance was not at all published in any newspaper of general circulation, and the owners and drivers of all vehicles traversing along the areas covered by the Ordinance were not properly informed of the prescribed speed limits thereunder. [See Municipality of Tupi v. Faustino, G.R. No. 231896, Aug. 20, 2019] Hence, the Ordinance is unconstitutional.\n\nALTERNATIVE ANSWER:\n\nABC is correct that due process was satisfied.\n\nThe Local Government Code does not make it indispensable for local ordinances to be published in newspapers of general circulation, especially where there is no such publication in the locality. “In the absence of any newspaper of general circulation within the province, posting of such ordinances shall be made in all municipalities and cities of the province where the sanggunian of origin is situated.” [See Local Government Code, Sec. 59(c)]\n\nIf there was no newspaper of general circulation in the municipality, then the non-publication of the Ordinance did not violate due process.",

      "q": "President X constituted the National Independence Commission (NIC), an ad hoc body tasked with the preparation of the celebrations for the 127th Philippine Independence Day; and appointed Mr. Y as its Chairperson. Subsequently, Mr. Y was charged with violation of Republic Act No. 3019 or the Anti-Graft and Corrupt Practices Act for alleged irregularities committed in his capacity as NIC Chairperson. In his defense, Mr. Y claimed that he never received any compensation as NIC Chairperson, thus, he could not be considered as a public officer. Is Mr. Y correct? Reason(s).",
      "key": "No, Mr. Y is not correct.\n\nIn defining public officers, what is controlling is whether the person is invested with some form of sovereign function, and is exercising the same in the public interest,\n\nthrough government bodies or institutions. Compensation is thus not an indispensable qualification for determining whether a person is a public office. Under R.A. 3019, even those receiving only nominal compensation are considered public officers.\n\nIn this case, Mr. Y was appointed as the Chairperson of the NIC, a body created by the government to oversee the public function of the country’s celebration of the 12th Philippine Independence Day. He is therefore a public officer covered by R.A. 3019. [Laurel v. Desierto, G.R. No. 145368, Apr. 12, 2002]",

      "q": "X, an independent candidate, filed her Certificate of Candidacy (COC) for Mayor of Butuan City for the 2025 National and Local Elections. Y also filed her COC for the same position. After the last day of filing COCs, X withdrew her COC for Mayor of Butuan City and opted to run for Vice Mayor instead. She was substituted by Z who filed her COC for Mayor of Butuan City. Y challenged the substitution on the ground that since X is an independent candidate, she cannot be substituted. Is the challenge correct? Reason(s).",
      "key": "Yes, the challenge is correct.\n\nUnder the Omnibus Election Code, the right to field a substitute candidate is reserved to duly registered political parties. [Section 77] Independent candidates, by definition, do not belong to any political party, and therefore no party can nominate a substitute for them. Allowing substitution in such cases would undermine the integrity of the electoral process and open the door to circumvention of candidacy rules.\n\nIn this case, X is an independent candidate and thus not a member of a political party. Since she does not belong to any registered political party, she cannot be substituted by Z. [Engle v. COMELEC, G.R. No. 215995, Jan. 19, 2016]",

      "q": "A was a rider for one of the largest online shopping platforms in the Philippines. She collected several parcels from XYZ Retail Store for delivery to the customers. She immediately noticed though the unique smell emanating from the parcels but chose to ignore the same. While she was driving, a stray dog suddenly crossed the road, prompting her to hit the brakes hard. As a result, one of the parcels fell and burst, revealing several grams of dried cannabis (marijuana). A reported the incident to the nearby police station. Consequently, the owner of XYZ Retail Store, B, was charged with illegal sale of dangerous drugs. In his defense, B invoked his right against unreasonable search and seizure which A allegedly violated when the latter mishandled the parcel. Is B correct? Reason(s).",
      "key": "No, B is not correct.\n\nThe constitutional proscription against unlawful searches and seizures applies as a restraint directed only against the government and its agencies tasked with the enforcement of the law. Thus, it could only be invoked against the State to whom the restraint against the arbitrary and unreasonable exercise of power is imposed. [People v. Marti, G.R. No. 81561, Jan. 18, 1991; Cadajas v. People, G.R. No. 247348, Nov. 16, 2021]\n\nHere, A, the rider for an online shopping platform, is a private person and not an agent of the government. B, therefore cannot invoke the constitutional protection of the right against unreasonable searches and seizures.",

      "q": "During the campaign period for the 2025 National and Local Elections, political unrest in the Province of XYZ led to a shootout between private armies in front of the provincial capital. Thirty people, including innocent bystanders, were among the casualties. In response, President Z declared a state of emergency in the Province of XYZ and issued a directive for the Armed Forces of the Philippines (AFP) and the Philippine National Police (PNP) to prevent and suppress all incidents of lawless violence in the said province. Governor X questioned President Z’s directive for alleged lack of proper authority from the Congress. Is the challenge meritorious? Reason(s).",
      "key": "No, the challenge is not meritorious.\n\nA declaration of a state of emergency is within the President’s authority, falling within his “calling out” power to prevent or suppress lawless violence. In such a case, the President does not require proper authorization from Congress. In contrast, the exercise of emergency powers by the President under Article VI, Section 23(2) of the Constitution requires a prior declaration and delegation by Congress. [See Ampatuan v. Puno, G.R. No. 190259, June 7, 2011]\n\nHere, the President declared a “State of Emergency,” not the exercise of emergency powers. As this declaration is simply an exercise of his commander-in-chief powers under Article VII, Section 18 of the Constitution to call out such armed forces to prevent or suppress lawless violence, it requires no delegation from Congress. [David v. Macapagal-Arroyo, G.R. No. 171396, May 3, 2006] The President’s declaration and directive are therefore valid.",

      "q": "Taking notice of the popularity, both here and abroad, of the unique perfume called Scent of Silay produced by XYZ Fragrance Company located in Silay City, Negros Occidental, the Sangguniang Panlungsod of Silay City passed Ordinance No. 12345, imposing a tax equivalent to 1% per export sale on “all productions of Scent of Silay by XYZ Fragrance Company”. XYZ Fragrance Company assailed Ordinance No. 12345 on the ground that the same violated its right to equal protection of laws as it was singled out therein. Decide with reason(s).",
      "key": "XYZ Fragrance Company is correct.\n\nThe equal protection clause applies only to persons or things identically situated and does not bar a reasonable classification of the subject of legislation, and a classification is reasonable where: (1) it is based on substantial distinctions which make real differences; (2) these are germane to the purpose of the law; (3) the classification applies not only to present conditions but also to future conditions which are substantially identical to those of the present; (4) the classification applies only to those who belong to the same class.\n\nIn this case, XYZ Fragrance Company is singled out by the Sangguniang Panlungsod of Silay City when it passed Ordinance No. 12345, expressly stating in the Ordinance that it will impose tax on the export sale on all productions of Scent of Silay by XYZ Fragrance Company. As the Ordinance does not consider future conditions wherein other fragrance companies may be established, it violates the third requisite of the equal protection clause and is unconstitutional. [Ormoc Sugar Co. v. Treasurer of Ormoc City, G.R. No. L-23794, Feb. 17, 1968]",

      "q": "A owned three condominium units located near Camp Aguinaldo along EDSA. In 2020, A leased the three condominium units to the government for the use of its military officials, X, Y, and Z, as their offices for a period of three years. In 2024, A sued X, Y, and Z to recover possession of the condominium units because their respective leases had expired and they refused to vacate the premises despite demands. A also prayed for payment of rent in arrears. X, Y, and Z moved to dismiss the case for lack of jurisdiction on the ground of state immunity from suit. A countered that the lease contracts were commercial contracts, not falling within the doctrine of state immunity from suit. Is A correct? Reason(s).",
      "key": "SUGGESTED ANSWER #1:\n\nNo, A is incorrect.\n\nThe doctrine of state immunity applies for as long as the government and its agents act in the exercise of their sovereign functions, or jus imperii. This is in contrast to when states enter into jus gestionis or commercial transactions. [United States v. Ruiz, G.R. No. L-35645, May 22, 1985]\n\nIn this case, the military was using the condominium units as offices, making the leases transactions entered into for the purpose of its public functions. They are not commercial contracts which would constitute a waiver of state immunity.\n\n[For the Examiner: Please consider points for candidates who make the following observation.] Nevertheless, while the doctrine of state immunity would normally apply, it cannot be used as an instrument to perpetrate an injustice on a citizen. State immunity is limited by the principle that no person shall be deprived of life, liberty, or property without due process of law. [Philippine Navy Gold Club, Inc. v. Abaya, G.R. No. 235619, July 13, 2020] Here, the government has taken the private property of a citizen for public use without paying just compensation. A is therefore entitled to recover possession and to the back payment of rentals from the military.\n\nSUGGESTED ANSWER #2:\n\nYes, A is correct.\n\nUnder the doctrine of state immunity, the State may not be sued without its consent. [Constitution, Art. XVI, Sec. 3] However, jurisprudence has long recognized a distinction between acts done in the exercise of sovereign functions (jure imperii) and those undertaken in a proprietary or commercial capacity (jure gestionis). [United States v. Ruiz, G.R. No. L-35645, May 22, 1985] When the government enters into\n\nprivate contracts, such as lease agreements for office space, it descends to the level of a private party and is deemed to have impliedly waived its immunity from suit. Further, the doctrine of governmental immunity from suit cannot serve as an instrument for perpetrating an injustice on a citizen. [See Ministerio v. Court of First Instance of Cebu, G.R. No. L-31635, Aug. 31, 1971]\n\nIn this case, the lease contracts entered into by the government were commercial in nature, falling under the category of jure gestionis. A leased her condominium units to the government for use as offices by military officials. This arrangement is not inherently governmental—it does not involve the exercise of police power, military command, or any sovereign prerogative. It is a private lease contract, and the refusal of X, Y, and Z to vacate after expiration of the lease gives rise to a civil dispute, not a protected governmental act.\n\nTherefore, the motion to dismiss on the ground of state immunity should be denied, and the case should proceed.",

      "q": "The President appointed A as Chairperson, and B, C, D, and E as Commissioners, of the Commission on Human Rights. Their appointments stated that they may qualify and enter upon the performance of the duties of their respective offices. Later on, a petition for certiorari and prohibition was filed, questioning the permanent appointments of A, B, C, D, and E for lack of confirmation by the Commission on Appointments. Is the challenge correct? Reason(s).",
      "key": "No, the challenge is not correct.\n\nThe Commission on Appointments’ participation in the appointing process is limited only to “heads of the executive departments, ambassadors, other public ministers and consuls, or officers of the armed forces from the rank of colonel or naval captain, and other officers whose appointments are vested in [the President] in this Constitution.” [Constitution, Art. VII, Sec. 16] Other presidential appointments, such as those provided by law, need not secure the confirmation of the Commission on Appointments.\n\nIn this case, the Commission on Human Rights (CHR) is not one of the three independent constitutional commissions. Its members are also not listed in the first category of officers in Article VII, Section 16 of the Constitution. Instead, the appointment of the chairperson and commissioners of the CHR is granted to the President only by law. Therefore, the appointments of A, B, C, D, and E are valid\n\nnotwithstanding lack of confirmation. [Bautista v. Senator Salonga, G.R. No. 86439, Apr. 13, 1989]",

      "pts": 5,
      "q": "Before commencing the proceedings in her court for the day, Judge A would require all the litigants and the lawyers in the courtroom to recite a prayer which she herself composed; otherwise they will be cited in contempt. B, an atheist, believes that this court policy is a violation of the non-establishment clause in the Constitution. Is B correct? Reason(s).",
      "key": "Yes, B is correct.\n\nThe Constitution provides that no law shall be made respecting an establishment of religion, or prohibiting the free exercise thereof. [Art. III, Sec. 5] The government cannot pass laws or perform acts which aid one religion, aid all religions, or prefer one religion over another. Also, no person can be punished for entertaining or professing religious beliefs or disbeliefs, for church attendance or non-attendance.\n\nIn this case, Judge A is compelling lawyers and litigants to recite a prayer she composed under threat of contempt. Judge A is an authority of the State, and her coercion that a prayer shall be recited with penalty for non-compliance is tantamount to favoring a religion and discriminating against/punishing non-believers by the State, which is exactly what the non-establishment clause prohibits. [See Estrada v. Escritor, A.M. P-02-1651, Aug. 4, 2006]",

      "pts": 5,
      "q": "A, a popular actress, was accused of estafa. She filed a motion for news reporters to cover her trial on live television. Judge B denied the motion. A sought reconsideration, arguing that the denial of her motion violated the right of the public to information on matters of public concern and her right to public trial. Judge B still did not reconsider. He explained that public trial does not mean publicized trial. Decide with reason(s).",
      "key": "Judge B may validly deny the motion for a televised trial.\n\nThe right to a public trial does not equate to a right to have a trial publicized or broadcast on live television or radio. A “public trial” only requires that court proceedings be open to those who wish to attend, ensuring transparency and\n\naccountability. Requests for live media coverage have been denied to protect the rights of the accused to due process and a fair trial, and to maintain the dignity of court proceedings.\n\nHere, Judge B's denial of the motion was consistent with the Constitution and Supreme Court decisions and is thus justified. [In re: Radio-TV Coverage of the Estrada Plunder Case, A.M. No. 01-4-03-SC, June 29, 2001]",

      "pts": 5,
      "q": "On December 11, 2023, the Senate and the House of Representatives approved the Absolute Divorce Bill and transmitted the same to the Office of the President for signature. On December 20, 2023, President X vetoed the bill, citing a recent national survey which showed that majority of Filipinos do not support absolute divorce for being contrary to the teachings of the Catholic church. Representative Y, the author of the Absolute Divorce Bill, assailed the constitutionality of the veto for allegedly violating the principle of separation of powers as the President was deemed to have imposed his will on the legislature. Is Representative Y correct? Reason(s).",
      "key": "No, Representative Y is not correct.\n\nUnder the Constitution’s presentment clause, every bill passed by the Congress shall, before it becomes a law, be presented to the President for his approval or veto. [Art. VI, Sec. 27(1)] Through this veto power, the Constitution makes the Chief Executive an integral part of the law-making process. The veto power allows the Chief Executive to reject a bill for reasons within his discretion, including policy considerations he considers essential, so long as the action is not arbitrary. Hence, the courts “will indulge every intendment in favor of the constitutionality of a veto.” [Belgica v. Ochoa, G.R. No. 208566, Nov. 19, 2013]\n\nIn this case, the veto exercised by President X over the Absolute Divorce Bill is a legitimate expression of his function under the Constitution: Congress is vested with the authority to pass bills, but at the same time, the President is given the right to approve or disapprove the same. It is then up to Congress to override the veto of the President if it is so minded. The President’s veto is thus consistent with this scheme and is not unconstitutional.\n\n[For the Examiner: Please consider points for answers that would argue the veto as unconstitutional for privileging a particular religion’s dogma in violation of the establishment clause. See Ang Ladlad LGBT Partylist v. Commission on Elections, G.R. No. 190582, Apr. 8, 2010.]",

      "q": "Pursuant to its power under Article VIII, Section 5(5) of the Constitution, the Supreme Court launched its Strategic Plan for Judicial Innovations 2022-2027 (SPJI). What are the four guiding principles and three target outcomes of the SPJI?",
      "key": "The Supreme Court’s Strategic Plan for Judicial Innovations 2022-2027 (SPJI) is founded upon four guiding principles and aims to achieve three key outcomes.\n\nThe Four Guiding Principles are: 1. Timely and Fair Justice – Ensuring justice is delivered promptly and equitably to all parties. 2. Transparent and Accountable Justice – Promoting openness in judicial processes and accountability among court personnel. 3. Equal and Inclusive Justice – Guaranteeing access to justice regardless of socio-economic status or background. 4. Technology Adaptive Management – Modernizing court operations through the adoption of new technologies to increase efficiency and accessibility.\n\nThe Three Target Outcomes are: 1. Efficiency of Court Processes – Streamlining procedures and utilizing case management systems for faster case resolution. 2. Judicial Innovation– Fostering a future-ready judiciary through technology integration, digital transformation, and ongoing reform. 3. Access to Justice – Reducing barriers, strengthening legal aid, and building a judiciary accessible to all Filipinos, including marginalized sectors.\n\n[For the Examiner: Please consider answers that either identify or explain the above principles and outcomes.]",

      "q": "XYZ Corp. filed an administrative complaint for patent infringement against ABC Company. XYZ Corp. was the patentee of Philippine Patent No. I-12345, which boasts of the innovative step of curing ham by exposing it to a filtered smoke cooled in a cooling unit between 10° and 12°C while retaining ingredients exerting highly preservative and sterilizing effects. ABC Company employs a similar method, the only difference being that it cools down its filtered smoke between 20° and 24°C instead of 10° and 12°C. ABC Company maintained that it is not guilty of infringing Patent No. I-12345 because its process is not exactly the same as XYZ Corp.’s. XYZ Corp. countered, however, that infringement was committed because ABC Company’s process performs substantially the same function and achieves substantially the same result as its own. Decide with reason(s).",
      "key": "SUGGESTED ANSWER #1:\n\nABC Company is guilty of patent infringement. Under the doctrine of equivalents, infringement also occurs when a product or process appropriates a prior invention by incorporating its innovative concept, albeit with some modifications and changes, and performs substantially the same function in substantially the same way to achieve substantially the same result. It requires satisfaction of the function-means- and-result test. (Pascua Godines v. Court of Appeals and SV-Agro Enterprises, Inc., G.R. No. 97343, September 13, 1993; BAR 2015.)\n\nBased on the facts, ABC Company introduced only minor innovations but appropriated the innovative concept of XYZ’s patented product. But it performs the same function, in the same way, to accomplish the same result.\n\nSUGGESTED ANSWER #2:\n\nABC Company is not guilty of patent infringement. The patentees, in enforcing their rights, and the courts in interpreting the claims, cannot go beyond what is stated in the claims, especially when the language is clear and distinct.\n\nUnder the doctrine of equivalents test, the courts consider whether the elements in the alleged infringing product or process are equivalent to the elements expressed in the patent's claim(s). There is patent infringement if the allegedly infringing product or process appropriates the innovative concept of the patent, and despite\n\nmodifications introduced in the infringing product or process, it still performs substantially the same functions in the same way to produce the same result.\n\nHere, ABC Company failed to establish that the simultaneous cooling of the filtered smoke cooled will cure the ham meat in substantially the same way as the pre-cooled filtered smoke ham. The eventual cooling of the filtered smoke in ABC Company does not ipso facto indicate similarities in the effect of the smoke on the ham meat.\n\n(Phillips Seafood Philippines Corp. vs. Tuna Processors, Inc., G.R. No. 214148, February 6, 2023)",

      "q": "X, a German national, was a devout follower of BBB religion. He came to the Philippines to spread the teachings of BBB religion. He soon gained thousands of followers, and formed a corporation sole, ABC Corporation, in accordance with Philippine laws. ABC Corporation, through X, purchased a building where the followers of BBB religion can perform their rituals and ceremonies. Y, a concerned citizen, assailed the acquisition of real property by ABC Corporation since its leader, X, is a foreigner. X countered that since all its members are Filipino citizens, ABC Corporation is qualified to own real property in the Philippines. Decide with reason(s).",
      "key": "SUGGESTED ANSWER #1:\n\nYes, ABC is qualified to acquire real property in the Philippines. A corporation sole, regardless of the nationality of its head or leader, is qualified to acquire real property in the country, provided that at least 60% of its members are Filipino citizens. Once the presiding head of any religious group is organized into a corporation sole, he becomes a trustee for the purpose of administering the affairs, temporalities, and property of such religious group. His nationality is irrelevant to the legal capacity of the religious group for real property acquisition. The nationality of its members is the paramount consideration. Based on the facts, all the members of the religious group are Filipino citizens. (Roman Catholic Apostolic Administrator of Davao vs. The Land Registration Commission, G.R. No. L-8451, December 20, 1957) Assuming further that ABC Corporation was validly organized as a corporation sole, under the Revised Corporation Code (R.A. 11232, Sec. 108 and 109), only the chief archbishop, bishop, priest, minister, rabbi, or other presiding elder of a religious denomination, sect, or church may form a corporation sole to administer the affairs, properties, and temporalities of the religious organization. Such an official must represent a religious group with established rites, creeds, and congregations. This was not established in this case.\n\nSUGGESTED ANSWER #2:\n\nABC Corporation is qualified to own real property in the Philippines. ABC Corporation is not purchasing the land, but only the building. It is to be noted that\n\nthere is no nationality requirement in the acquisition of a building. The nationality requirement applies only to land acquisition.\n\nEven assuming that the land on which the building stands is also being acquired, the Corporation Sole (ABC Corporation) can acquire said land because it will be considered as a Philippine national since all its members are Filipino citizens. Its nationality is determined not by the nationality of its presiding officer but by the nationality of its members (Roman Catholic Apostolic Administrator of Davao vs. The Land Registration Commission, G.R. No. L-8451, December 20, 1957).",

      "pts": 5,
      "q": "X sells luxury bags on her Facebook page. Interested buyers were required to comment “mine” together with the codename of the product to express their offer to buy. The first one to comment, evidenced by a screenshot, would get the item. During one of her Facebook livestreams, X offered for sale a luxury bag of a well- known brand from Italy for which the code name “Italy” was assigned. Y, an interested viewer, was the first to post her comment, “Mine Italy.” She then took a screenshot of her message with the item still shown in the background. Despite this, X sold the bag to her sister, Z. Y demanded that X sell her the bag, contending that the screenshot of her comment was adequate proof of the existence of a perfected contract of sale under the Electronic Commerce Act. Is Y correct? Reason(s).",
      "key": "SUGGESTED ANSWER #1:\n\nY is correct. Subject to authentication and assuming that the elements of a valid sale contract, such as consent, object, and consideration, were all established, the screenshot of the message proves the perfection of the sale contract. Except as otherwise agreed by the parties, an offer, the acceptance of the offer and such other elements required under existing laws for the formation of contracts may be expressed in, and demonstrated and proved by means of electronic data messages or electronic documents (Section 16 of RA 8792). Screenshot of a Facebook message is considered an electronic data message since it pertains to information sent, received, or stored by electronic and optical means. (Serrano v. Cruz-Angeles, AC No. 10985, July 28, 2024)\n\nSUGGESTED ANSWER #2:\n\nNo, Y is not correct.\n\nUnder Article 1475 of the Civil Code, a contract of sale is perfected at the moment there is a meeting of minds between the seller and the buyer as to the object of the sale and the price.\n\nIn the present case, while X offered the bag for sale, Y’s act of commenting “Mine Italy” constitutes an acceptance of the offer to sell or, at most, an offer to buy. In Spouses\n\nMendoza v. Quisumbing (G.R. No. 183552, November 12, 2012), the Supreme Court reiterated that mutual consent must be clearly established for a sale to be perfected. The mere act of signifying intent to buy, without the seller’s corresponding acceptance, does not result in a perfected contract.\n\nAlthough the Electronic Commerce Act (R.A. 8792) and the case of MCC Industrial Sales Corp. v. Ssangyong Corp. (G.R. No. 170633, October 17, 2007) places electronic documents and data messages on the same footing as written documents, and thus admissible in evidence, this only pertains to form and admissibility of proof. It does not cure the absence of the essential element of consent. Proof of an electronic message does not automatically establish a perfected contract if the meeting of minds is lacking.\n\nFurther, in Bautista v. Technological Institute of the Philippines (G.R. No. 180481, March 13, 2009), the Court held that “mere intention to buy” is not sufficient; there must be concurrence of both parties on the terms. Here, X never confirmed or accepted Y’s comment, and instead sold the bag to Z. Until such acceptance is shown, ownership remains with X, who retains the freedom to dispose of her property.",

      "pts": 5,
      "q": "A is a former Filipino who now permanently resides in Canada. In December 2024, she visited the Philippines to spend the holidays with her family in Quezon City. As she was departing to go home to Canada, she decided to buy wine in the airport shop. She noticed that in the Sales Invoice issued to her, she was charged 12% value-added tax (VAT) for the wine she bought. She questioned the imposition of the VAT, contending that because the wine will be consumed in Canada, no VAT should be imposed thereon. Is A correct? Reason(s).",
      "key": "No, A is not correct. Her purchase of wine at the airport shop is still subject to 12% VAT despite her intention to consume the wine in Canada.\n\nAs a rule, Section 106(A) of the National Internal Revenue Code (NIRC) imposes VAT on every sale, barter, or exchange of goods or properties at a VAT of 12% of the gross selling price.\n\nIt must be noted that although there are duty-free shops inside NAIA that enjoy exemptions from taxes and duties, not all airport shops qualify as duty free shops. Unfortunately, A purchased from a shop not registered as a zero-rated establishment. Ordinary commercial shops in airports are considered ordinary taxpayers subject to VAT and other taxes. While it is true that our VAT system follows the destination principle in CIR v. American Express International, Inc. (2005), our VAT law itself provides for specific requirements to qualify as a zero-rated sale, i.e., the sale must be paid in acceptable foreign currency and the proceeds of which must be duly\n\naccounted for in accordance with the BSP rules and regulations. (Sec. 106(A)(2)(a) NIRC).\n\nFinally, it is worth noting that Republic Act No. 12079 (effective December 24, 2024) introduced a VAT Refund System (VRS) for tourists under the following conditions: a. The goods are purchased in person by the tourist from duly accredited stores; b. The goods are physically taken out of the Philippines by the tourist as accompanied baggage within 60 days from the date of purchase; and c. The value of goods per single transaction is at least ₱3,000.00, covered by a single invoice.",

      "q": "X obtained an insurance policy for her Porsche Carrera GT from XYZ Insurance Company. The same car was insured by her creditor-mortgagee, Y, with ABC Insurance Company. When the car was damaged because of an accident, X filed a claim with XYZ Insurance Company. The latter denied the claim since it discovered that the car was also insured with ABC Insurance Company. According to XYZ Insurance Company, double insurance is prohibited by law. Decide with reason(s).",
      "key": "In the absence of other insurance clauses in the insurance policy, double insurance is not prohibited by law. The other insurance clause means that the insured must disclose existing and/or subsequent insurance coverage on the same insured party; otherwise, the insurer may rescind the policy. The facts of the question do not indicate, however, the existence of other insurance clause stipulations in the policy. And even assuming that such a stipulation exists, thereby prohibiting double insurance, there is, however, no double insurance in the case. A double insurance exists where the same person is insured by two or more insurers separately in respect of the same subject, risk, and interest. The insurable interest on the mortgaged property of a mortgagor, which covers the full value of the property, and the interests of a mortgagee, which extends only to the value of the debt, are distinct and separate. Since the two policies obtained on the subject vehicle do not cover the same interest and risk, no double insurance exists. (Armando Geagonia v. Court of Appeals and Country Bankers Insurance Corporation, G.R. No. 114437, February 6, 1995)",

      "q": "The Congress enacted Republic Act No. 1234, imposing real property tax on immovable properties owned by Filipinos, whether found within or outside the Philippines. X, a Filipino residing in California, United States of America (USA), assailed the validity of Republic Act No. 1234, arguing that the Republic of the Philippines has no jurisdiction to tax properties found outside of the Philippines. The Office of the Solicitor General (OSG), on the other hand, averred that pursuant to its inherent power of taxation, the Republic of the Philippines may impose taxes on all citizens and residents of the Philippines and their properties whether situated in the country or abroad. Decide with reason(s).",
      "key": "No. The contention of the Solicitor General is without merit. The power of taxation of our government is under the Doctrine of Territoriality, which means that the government can only tax things that are within its territorial jurisdiction, such as businesses and properties. This principle finds application only when what is taxable is an exercise of a right by a Filipino or a domestic corporation. Hence, the Philippine government can validly impose income tax on income earned by resident Filipinos abroad (except OCW and seamen on their compensation income) or domestic corporations because income tax, like estate tax and donor’s tax, is a tax on the exercise of a right. Real properties can be taxed by the Philippine government only when they are located within the Philippines. It has been held that real property cannot be taxed, except by the state or country where it is located, regardless of whether the owner is a resident or non-resident (First National Bank v. Maine, 284 U.S. 312 dated December 10, 1931).",

      "q": "To celebrate her 70th birthday, A hired F Travel & Tours to arrange and facilitate her booking, ticketing, and accommodation for a two-week foreign tour, which included visits to Italy and Greece, for the total amount of PHP 145,000.00. On Wednesday, August 14, 2024, B, an employee of F Travel & Tours, went to A’s house to deliver the travel documents and plane ticket. She told A to be at the Ninoy Aquino International Airport (NAIA) on Saturday, August 17, 2024 two hours before her flight schedule. Without checking her travel documents, A went to NAIA on Saturday, August 17, 2024. When she got there, she was informed that the flight she was supposed to take had already left the previous day. A demanded that F Travel & Tours refund her payment. She claimed that F Travel & Tours did not observe the standard of care required of a common carrier when its employee, B, informed her of the wrong flight schedule. Is F Travel & Tours liable as a common carrier? Reason(s).",
      "key": "No, F Travel & Tours is not liable as a common carrier.\n\nAccording to Article 1732 of the Civil Code of the Philippines, common carriers are defined as persons, corporations, firms, or associations engaged in the business of carrying or transporting passengers or goods or both, by land, water, or air, for compensation, offering their services to the public. Moreover, as held in Crisostomo vs. Court of Appeals (G.R. No. 138334, August 25, 2003), a travel agency is not an entity engaged in the business of transporting either passengers or goods. It is therefore, neither a private nor a common carrier.\n\nIn the present case, F Travel & Tours did not undertake to transport A from one place to another. F Travel & Tours was simply contracted to make travel arrangements on behalf of A, which includes booking tickets and facilitating travel permits or visas, as well as other relevant travel documents for A’s tour. Since F Travel & Tours cannot be considered as a common carrier as defined by Article 1732 of the Civil Code, it follows that the extraordinary diligence imposed on common carriers does not apply to it.\n\nWhile, extraordinary diligence must be observed not only in the transportation of goods and services but also in the issuance of the contract of carriage, including its ticketing operations, the common carrier’s obligation to exercise extraordinary diligence in the issuance of the contract of carriage is fulfilled, however, by requiring a full review of the flight schedules to be given to a prospective passenger before payment. Thus, even assuming that the ticketing agent encoded the incorrect flight information, it is incumbent upon the purchaser of the tickets to at least check if all the information is correct before making the purchase. Once the ticket is paid for and printed, the purchaser is presumed to have agreed to all its terms and conditions. (Alfredo Manay, Jr. v. Cebu Air, Inc., G.R. No. 210621, April 4, 2016)",

      "q": "A was a rich businessperson with two wives. He married B, with whom he had three children namely, C, D, and E. While their marriage was subsisting, he met X with whom he madly fell in love. He also married her despite his first marriage. They had a child named Y. In his life insurance policy from XYZ Life Insurance Corp., A designated his second wife, X, and their son, Y, as beneficiaries. Five years later, A died. X filed a claim for the proceeds of the policy for herself and for Y as the designated beneficiaries. At the same time, B also filed a claim for death benefits for herself and her children, C, D, and E, as A’s legal wife and legitimate children. Who is/are entitled to the life insurance proceeds? Reason(s).",
      "key": "The legitimate heirs of A, namely B, C, D, and E, who were not designated as beneficiaries in the life insurance policy, are considered third parties to the insurance contract, and thus not entitled to the proceeds thereof. The insurer has no legal obligation to turn over the proceeds to them. The unlawful designation of X as beneficiary is of no moment, considering that the designation of Y as beneficiary under Article 2012 (in relation to Article 739) of the Civil Code remains valid. Under Section 53 of the Insurance Code, as a rule, the proceeds belong to the designated beneficiary. Because no legal proscription exists in naming as beneficiary the child of an illicit relationship by the insured, the share of X in the insurance proceeds, whether forfeited by the court in view of the Civil Code prohibition on X’s being designated as beneficiary or by the insurer for reasons based on the insurance contracts, must be awarded to Y. (Heirs of Loreto Maramag v. Eva Verna De Guzman Maramag, et al., G.R. No. 181132, June 5, 2009; 1998 and 2019 Bar exams.)",

      "q": "X, an Indian national studying medicine in the Philippines, learned that the foreign medical books prescribed by his professors were sold at a much cheaper price in India. He thus ordered 30 copies of each book in India and had them shipped to the Philippines. He sold these copies to his blockmates for a price 30% cheaper than the prevailing Philippine prices. XYZ Publishing Co., Inc., the exclusive licensed publisher of the books in the Philippines, sued X for copyright infringement. In his defense, X argued that he has the right to resell the books he got from India, hence, he is not liable for copyright infringement. Is X correct? Reason(s).",
      "key": "SUGGESTED ANSWER #1:\n\nX did not commit copyright infringement. Under the “first sale” doctrine, the economic rights of the author relevant to the question extend only to the first public distribution of each original copy. After the first sale of the original copies, the owner may use and resell the same. Hence, there is no infringement by X since the said doctrine permitted resale without the publisher’s further permission. (BAR 2014; Kirtsaeng v. John Wiley & Sons, Inc., 568 U.S 319, 213 WL 1104736 (U.S Mar. 19, 2013), cited in Gepty, ibid., p. 179.)\n\nSUGGESTED ANSWER #2:\n\nX is not correct. The first sale doctrine does not justify the commercial importation and resale of multiple copies acquired abroad. By doing so, X infringed on the exclusive distribution and importation rights of XYZ Publishing, in violation of Sections 177.3 and 177.6 of the Intellectual Property Code.\n\nThe doctrine of first sale applies only to the disposition of a lawfully acquired copy within the same market where it was first sold. It does not authorize the importation and distribution of copies acquired abroad in circumvention of the exclusive distribution rights of the local licensee.\n\nIn Kho v. Court of Appeals (G.R. No. 115758, March 19, 2002), the Supreme Court upheld the rights of book publishers against the unauthorized reproduction and sale of copyrighted works, stressing that such acts infringe on the copyright owner’s exclusive rights. By analogy, unauthorized importation and commercial distribution of multiple copies also violate these rights.",

      "q": "On January 5, 2023, A subscribed to 1,000 shares of ABC Corporation with a par value of PHP 1,000.00 each. She made an initial payment of PHP 400,000.00 for 400 shares. As for the remaining 600 shares, she undertook to pay the same in installment for three months. But she never paid for these shares even after the deadline. Thirty days later, the Board of Directors of ABC Corporation declared A’s shares delinquent. During the election of directors in July 2023, A wanted to vote on her 400 shares, which she had already paid. ABC Corporation, however, prohibited her from voting due to her alleged delinquent account. Is ABC Corporation correct? Reason(s).",
      "key": "ABC is correct. Under the Revised Corporation Code, if no payment is made within 30 days from the due date, all stocks covered by the subscription shall become delinquent. The payment made by A cannot be proportionately applied to his subscription under the doctrine of indivisibility of subscription.\n\nNo delinquent stock shall be voted for, be entitled to vote, or be represented at any stockholders’ meeting, nor shall the holder thereof be entitled to any of the rights of a stockholder except the right to dividends in accordance with the provisions of the RCC, until and unless payment is made by the holder of such delinquent stock for the amount due on the subscription with accrued interest, and the costs and expenses of advertisement, if any. (Section 70, RCC)",

      "q": "In 2025, ABC Corporation applied for insolvency and was placed under receivership. One of its oldest creditors was XYZ Inc. which loaned ABC Corporation PHP 75 million in 2001. XYZ Inc. filed, before the rehabilitation court, a motion, praying that it be paid immediately ahead of all the other creditors because it was owed the largest sum which has been outstanding for 24 years already. TUV Company, another creditor, opposed the motion, invoking the principle of “equality in equity” and maintaining that all creditors stand on equal footing. Decide with reason(s).",
      "key": "TUV is correct. Whether it is a petition for liquidation or rehabilitation that the juridical insolvent debtor filed, the appointment of the receiver means that all assets of a corporation under liquidation or rehabilitation are held in trust for the equal benefit of all creditors until termination of the proceedings.” As all the creditors, secured or unsecured, ought to stand on equal footing, not any one of them should be paid ahead of others. No creditor should obtain an advantage or preference over another by the expediency of foreclosure, attachment, execution, or otherwise. (Negros Navigation Company v. Court of Appeals, G.R. Nos. 163156 and 166845, December 10, 2008, reiterated in Abrera v. Hon. Barza, supra.) It is only the mortgagee that can initiate a foreclosure proceeding 180 days from the issuance of the liquidation order. The facts of the question do not, however, indicate the existence of a mortgage.",

      "pts": 5,
      "q": "XYZ Inc. filed before the Intellectual Property Office (IPO) Trademark Application No. 1-2025-12345 for the mark “TURTLE AND DEVICE.” XYZ Inc.’s mark is an image of a turtle with the word “Turtle” on its side. ABC Inc. opposed the application, alleging that XYZ Inc.’s mark is confusingly similar or identical to its own mark, which is an image of a tortoise sans any accompanying words. In its defense, XYZ Inc. argued that the entirety or totality, not just the dominant part, of the marks should be considered in determining whether there is infringement. Decide with reason(s).",
      "key": "SUGGESTED ANSWER #1:\n\nXYZ is not correct. Only the dominancy test is used in determining the semblance of similar marks. This is found in Section 155.1 of the IPC which defines trademark infringement as the colorable imitation of a registered mark or a dominant feature thereof. Based on the legislative deliberations leading to the enactment of the IPC, the exclusion of the Holistic test was intentional and the dominancy test should be adopted. Considering the adoption of the Dominancy Test and the abandonment of the Holistic Test, as confirmed by the provisions of the IP Code and the legislative deliberations, the Supreme Court hereby made it crystal clear that the use of the Holistic Test in determining the resemblance of marks has been abandoned. (Kolin Electronics Co. Inc. V. Kolin Philippines International, Inc., G.R. No. 228165, February 9, 2021. J. Caguioa)\n\nSUGGESTED ANSWER #2:\n\nUnder Sec. 123.1[d] of the IP Code, a mark cannot be registered if it is identical or confusingly similar to a registered mark with respect to the same or closely related goods or services.\n\nPhilippine jurisprudence has developed two tests: 1. The dominancy test, which looks at the main, essential, or dominant features of the marks and asks whether these create the same overall impression in the mind of the ordinary purchaser 2. The holistic or totality test, which considers the marks in their entirety, including visual, aural, and commercial impressions.\n\nOrdinarily, the dominancy test controls in infringement cases. However, in the case of Lacoste S.A. v. Crocodile International Pte Ltd. (G.R. 223270, November 6, 2023), the Supreme Court clarified that when both marks depict the same generic or common device (there, crocodiles/reptiles), the holistic test must be applied. Otherwise, one registrant would obtain a monopoly over a natural concept. The Court examined differences in artistic style, orientation, and accompanying word elements to conclude that confusion was unlikely.\n\nAs applied to this case, XYZ Inc.’s mark consists of a turtle device with the word “Turtle,” while ABC Inc.’s mark is a tortoise device alone. If the dominancy test were rigidly applied, both marks highlight the same dominant idea—a shelled reptile—\n\nand confusion would likely result. But per Lacoste, the better approach is the holistic test, looking at the total impression. The addition of the word “Turtle” and possible differences in the artistic rendering of the turtle versus the tortoise device may be enough to dispel confusion.\n\nIn light of the case of Lacoste v. Crocodile, the opposition cannot succeed solely by pointing to the common reptile device. The IPO must apply the holistic test, and if the overall impressions of the marks are sufficiently distinct, XYZ Inc.’s application for “TURTLE AND DEVICE” may be allowed despite ABC Inc.’s opposition.",

      "q": "ABC Corporation increased its Authorized Capital Stock by issuing 1,000 additional shares. X, a shareholder, notified ABC Corporation in writing of her desire to exercise her pre-emptive right on 100 of the 1,000 additional shares. ABC Corporation, however, did not respond. Upon learning that ABC Corporation had already sold all the 1,000 additional shares to new stockholders, X filed a derivative suit on behalf of the corporation to enforce her pre-emptive right. Is the action proper? Reason(s).",
      "key": "The action will not prosper. One of the elements of a derivative suit is that it must be filed by a minority stockholder to enforce a corporate right or cause of action. X’s suit to enforce pre-emptive rights in a corporation is not a derivative suit because it was not filed for the benefit of the corporation. On the contrary, she was suing on her own behalf, out of a desire to protect and preserve her pre-emptive right. (Lim vs. Lim-Yu, G.R. No. 138343, February 19, 2001)",

      "kw": "pre-emptive right derivative suit",
      "keyLabel": "UP BRI suggested answer",

        {

      "q": "A leased out his penthouse condominium unit to B. Unfortunately, A figured in an accident and perished, leaving his son, C, as his sole heir. Subsequently, C demanded that B vacate the premises by noon of the following day. B refused, showing C the duly executed lease agreement between her and A. B claimed that she has a right to remain in the unit since the term of the lease was yet to expire. C countered that he had nothing to do with the lease contract as it was executed between his father and B and therefore does not bind him. Is C correct? Reason(s).",
      "key": "C is not correct. The lease contract binds C as the sole heir of A.\n\nUnder the Civil Code, contracts take effect only between the parties, their assigns and heirs, except in cases where the rights and obligations arising from the contract are not transmissible by their nature, or by stipulation or by law.\n\nLease contracts, by their nature, are not personal. The general rule is that lease contracts survive the death of the parties and continue to bind the heirs, except if the contract states otherwise.\n\nThere is no indication that the rights and obligations under the lease contract are non-transmissible by stipulation. Hence, C, as A's heir, assumes A's position and is bound by the terms of the lease contract between A and B, who has the right to remain in the unit until the lease expires. [Article 1311, New Civil Code (NCC); Sui Man Hui Can v. Court of Appeals, G.R. No. 147999, 27 February 2004; Heirs of Dimaculangan v. IAC, G.R. No. L-68021, 20 February 1989; Inocencio v. Hospicio de San Jose, G.R. No. 201787, September 25, 2013]",

      "q": "In a desperate attempt to dispose of her assets, X, a fugitive from justice, called her friend, Y, instructing him to sell her house and lot located at Forbes Park to the first interested buyer for not less than PHP 250 million. Y offered the property for sale to his boss, Z. Enticed by the offer, Z asked Y for a copy of the title and proof of Y's authority to sell the property. Y presented the title of the property, claiming that his possession of the title was sufficient proof of his authority to sell the property. Relying on the representation of Y, Z bought the property from Y, the agent of X. Is the sale valid? Reason(s).",
      "key": "No, the sale is void.\n\nUnder the Civil Code, when a sale of a piece of land or any interest therein is through an agent, the authority of the latter shall be in writing; otherwise, the sale shall be void.\n\nSince the object of the sale includes the lot, and the agent's authority is not in writing, the sale is void. [Article 1874, NCC].\n\n\nALTERNATIVE ANSWER:\n\nAs to the sale of the parcel of land, the same is void; but as to the sale of the house, the same is merely unenforceable.\n\nIn an agency to sell a parcel of land or any interest therein, the law requires the authority of the agent to be in writing; otherwise, the sale is void (Art. 1874, NCC). With respect to the sale of the house, which is an immovable property, the law requires that the agent must be granted a special power of attorney; otherwise, the agent is bereft of authority to sell the same, and the contract is rendered unenforceable [Art. 1878(5), in relation to Art. 1403, par. 1, NCC].\n\nIn the given case, considering that Y sold the land for and on behalf of X but without any written authority to do so, the sale of the parcel of land is void. But as to the sale of the house, since it does not appear that Y was granted by X a special power of attorney to sell the same, the sale is merely unenforceable because it was made by the agent without any authority from the principal.",
