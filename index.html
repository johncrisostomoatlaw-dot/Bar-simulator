    <p class="small muted">Write as you would in a consultation letter: the remedy you recommend, its legal basis, how the law applies to these facts, and what to do next.</p>
    <textarea id="adv" class="booklet" style="min-height:300px" spellcheck="false" placeholder="State your recommended remedy, the legal basis, its application to the facts, and the next steps.">${esc(I.advice)}</textarea>
    <div class="meta"><span id="wc">${words(I.advice)} words</span><span id="gnote"></span></div>
    <button class="primary" id="grade" ${pendingQ ? "disabled" : ""}>Advise the client</button>`;
  return "";
}

function renderIntake() {
  const I = S.intake, C = caseOf(I.id);
  if (I.stage === "advice") { I.stage = "interview"; ui.sheet = "advice"; }
  if (I.stage === "debrief") return renderDebrief(C, I);
  I.minutes ||= 0; I.docs ||= [];
  const left = minsLeft(I), out = left < ASK_MIN;
  if (out && !ui.timeUpShown) { ui.timeUpShown = true; ui.sheet = "advice"; }
  const lines = [{ q: null, a: C.opening }, ...I.asked.map(a => ({ q: a.q, a: a.reply }))];
  if (ui.line == null || ui.line >= lines.length) ui.line = lines.length - 1;
  const ln = pendingQ ? { q: pendingQ, a: "…" } : lines[ui.line];
  const tab = (id, label) => `<button class="vtab ${ui.sheet === id ? "on" : ""}" data-tab="${id}">${label}</button>`;
  app.innerHTML = `
  <div class="stage">
    <header class="stagebar">
      <div class="clockbox"><span>Time</span><strong class="${left <= 10 ? "low" : ""}">${fmtMin(I.minutes)} / ${fmtMin(HOUR)}</strong></div>
      <h2>${esc(C.title)}</h2>
      <div style="position:relative">
        <button class="iconbtn light" id="menu" aria-label="Menu" aria-expanded="${ui.menu}">${ICON.menu}</button>
        ${ui.menu ? `<div class="menu"><button id="quit">Back to cases</button><button id="restart">Restart case</button></div>` : ""}
      </div>
    </header>
    <main class="scene">
      <div class="shelf" aria-hidden="true"></div><div class="window" aria-hidden="true"></div><div class="frame" aria-hidden="true"></div>
      <div class="person">${avatar(C.look)}</div>
      <div class="desk"><span class="nameplate">${esc(C.client)}</span></div>
      <div class="bubble" aria-live="polite">
        ${ln.q ? `<p class="small muted">You: ${esc(ln.q)}</p>` : `<p class="label">${esc(C.subject)}</p>`}
        <p>${esc(ln.a)}</p>
        ${lines.length > 1 && !pendingQ ? `<p class="small muted" style="text-align:right">${ui.line + 1} / ${lines.length}</p>` : ""}
      </div>
      <nav class="vtabs left" aria-label="Investigate">${tab("interview", "Interview")}${tab("docs", "Documents")}${tab("notes", "Notes")}</nav>
      <nav class="vtabs right" aria-label="Advise">${tab("advice", "Advice")}</nav>
      ${ui.sheet ? `<section class="sheet ${ui.sheet === "advice" ? "fromright" : ""}">${sheetHTML(C, I)}</section>` : ""}
    </main>
    <footer class="stagefoot">
      <div class="ctrls">
        <button class="round" id="log" aria-label="Transcript">${ICON.log}</button>
        <button class="round big" id="prev" aria-label="Previous line" ${ui.line > 0 && !pendingQ ? "" : "disabled"}>${ICON.prev}</button>
        <button class="round big" id="next" aria-label="Next line" ${ui.line < lines.length - 1 && !pendingQ ? "" : "disabled"}>${ICON.next}</button>
        <button class="round ${ui.voice ? "on" : ""}" id="voice" aria-label="Read client aloud" aria-pressed="${ui.voice}">${ui.voice ? ICON.sound : ICON.mute}</button>
      </div>
      <form class="ask" id="askf">
        <input type="text" id="q" autocomplete="off" maxlength="400" placeholder="${out ? "The hour is up. Write your advice." : `Ask ${esc(C.client)}… (${ASK_MIN} min)`}" ${out || pendingQ ? "disabled" : ""} aria-label="Your question">
        <button class="primary" ${out || pendingQ ? "disabled" : ""}>Ask</button>
      </form>
    </footer>
  </div>`;

  const chat = $("#chat"); if (chat) chat.scrollTop = chat.scrollHeight;
  const rerender = () => { save(); render(); };
  $("#menu").onclick = () => { ui.menu = !ui.menu; render(); };
  if (ui.menu) {
    $("#quit").onclick = () => { ui.menu = false; ui.sheet = null; S.intake = null; home(); };
    $("#restart").onclick = () => { ui.menu = false; startIntake(C.id); };
  }
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { ui.sheet = ui.sheet === b.dataset.tab ? null : b.dataset.tab; render(); });
  app.querySelectorAll("[data-close]").forEach(b => b.onclick = () => { ui.sheet = null; render(); });
  $("#log").onclick = () => { ui.sheet = ui.sheet === "interview" ? null : "interview"; render(); };
  $("#prev").onclick = () => { ui.line--; render(); };
  $("#next").onclick = () => { ui.line++; render(); };
  $("#voice").onclick = () => { ui.voice = !ui.voice; if (!ui.voice) try { speechSynthesis.cancel(); } catch {} else speak(lines[ui.line].a); render(); };
  app.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => {
    const d = C.docs.find(x => x.id === b.dataset.doc);
    if (minsLeft(I) < d.min || I.docs.includes(d.id)) return;
    I.docs.push(d.id); I.minutes += d.min; reveal(I, d.reveals); rerender();
  });

  const ta = $("#adv");
  if (ta) {
    ta.oninput = () => { I.advice = ta.value; $("#wc").textContent = words(ta.value) + " words"; save(); };
    $("#grade").onclick = async () => {
      if (!I.advice.trim()) { $("#gnote").textContent = "Write your advice first."; return; }
      const btn = $("#grade"); btn.disabled = true; $("#gnote").textContent = "Reviewing your advice…";
      try {
        const g = await gradeAdvice(C, I);
        ui.sheet = null;
        if (!g) return renderSelfGrade(C, I);
        finishIntake(C, I, g);
      } catch (e) {
        const msg = e?.code in ERR ? ERR[e.code] : "Grading failed. Try again, or grade it yourself.";
        if (msg == null) { ui.sheet = null; return renderSelfGrade(C, I); }
        btn.disabled = false; $("#gnote").innerHTML = `${esc(msg)} <button id="selfg">Grade it myself</button>`;
        $("#selfg").onclick = () => { ui.sheet = null; renderSelfGrade(C, I); };
      }
    };
  }

  $("#askf").onsubmit = async e => {
    e.preventDefault();
    const q = $("#q").value.trim();
    if (!q || pendingQ || minsLeft(I) < ASK_MIN) return;
    pendingQ = q; I.minutes += ASK_MIN; save(); render();
    let r = null;
    try { r = I.offline ? null : await claudeReply(C, I, q); } catch {}
    if (!r) { I.offline = true; r = keywordReply(C, I, q); }
    reveal(I, r.reveal);
    I.asked.push({ q, reply: r.reply });
    pendingQ = null; ui.line = null; save(); render();
    speak(r.reply);
    $("#q")?.focus();
  };
}

async function gradeAdvice(C, I) {
  const sample = await getSample();
  if (!sample) return null;
  const prompt = `You are a senior partner in a Philippine law firm and a Bar examiner in Civil Law. Grade a junior lawyer's written advice to a client.

Grade ONLY against the rubric. Cite ONLY authorities from the REGISTRY, by id; never cite any other article, rule, or case. Quote the junior's own words as evidence. Do not reward length. A correct remedy with a wrong or missing legal basis is at most "partial". Do not penalize missing G.R. numbers when the doctrine is stated correctly.

ALL CASE FACTS (including any the junior did not elicit):
${C.facts.map(f => `- ${f.short}`).join("\n")}

FACTS THE JUNIOR ELICITED (interview and documents): ${I.revealed.map(id => C.facts.find(f => f.id === id).short).join("; ") || "none"}
DOCUMENTS THE JUNIOR REVIEWED: ${(I.docs || []).map(id => C.docs.find(d => d.id === id).title).join("; ") || "none"}

ANSWER KEY: ${C.key}

REGISTRY:
${C.registry.map(a => `[${a.id}] ${a.cite}: ${a.text}`).join("\n")}

RUBRIC:
${C.rubric.map(r => `[${r.id}] (${r.domain}, weight ${r.weight}) ${r.label}. Met when: ${r.met}`).join("\n")}

SAFETY BREACHES (advice that would harm the client):
${C.breaches.map(b => `- ${b}`).join("\n")}

JUNIOR'S ADVICE:
"""
${I.advice.slice(0, 12000)}
"""

Reply with only JSON:
{"criteria": [{"id": "r1", "verdict": "met" | "partial" | "missed", "evidence": "short quote, or what is missing", "ref": "registry id or empty"}],
 "wrong_bases": ["each legal basis the junior cited that is wrong or does not apply"],
 "breach": "one sentence naming any safety breach in the advice, or empty",
 "highlights": ["one to three short points"],
 "improvements": ["one to three short points"],
 "narrative": "one paragraph, direct, no praise sandwich"}`;
  const r = await sample.json(prompt, { modelTier: "complex" });
  const refs = new Set(C.registry.map(a => a.id)), list = x => Array.isArray(x) ? x.map(String).filter(Boolean).slice(0, 5) : [];
  return {
    by: "claude",
    criteria: C.rubric.map(rb => {
      const c = (Array.isArray(r?.criteria) ? r.criteria : []).find(x => x?.id === rb.id) || {};
      return { id: rb.id, verdict: c.verdict in VERDICT ? c.verdict : "missed", evidence: String(c.evidence || ""), ref: refs.has(c.ref) ? c.ref : "" };
    }),
    wrong: list(r?.wrong_bases), breach: String(r?.breach || "").trim(),
    highlights: list(r?.highlights), improvements: list(r?.improvements), narrative: String(r?.narrative || ""),
  };
}

function renderSelfGrade(C, I) {
  const picks = {};
  document.body.classList.remove("instage");
  app.innerHTML = `
  <header class="mast">
    <div><p class="label">Self-grade · ${esc(C.subject)}</p><h1>${esc(C.title)}</h1>
      <p class="muted small">Claude is not available here. Compare your advice with the model advice, then mark each criterion honestly.</p></div>
  </header>
  <div class="split">
    <section style="display:flex;flex-direction:column;gap:18px">
      <div><p class="label">Your advice</p><div class="answer">${esc(I.advice)}</div></div>
      <details open><summary>Model advice</summary><p class="key">${esc(C.model)}</p></details>
      ${C.rubric.map(r => `<div style="display:flex;flex-direction:column;gap:8px">
        <h3>${esc(r.label)} <span class="muted small">· ${r.weight} pts</span></h3>
        <p class="small muted">Met when: ${esc(r.met)}</p>
        <div class="opts" role="group">${Object.keys(VERDICT).map(v => `<button data-r="${r.id}" data-v="${v}">${v === "partial" ? "Partly met" : v[0].toUpperCase() + v.slice(1)}</button>`).join("")}</div>
      </div>`).join("")}
      <div><p class="label" style="margin-bottom:8px">Did your advice commit any of these?</p>
        ${C.breaches.map((b, k) => `<label class="check small" style="display:flex;gap:8px;margin-bottom:6px"><input type="checkbox" data-b="${k}"> ${esc(b)}</label>`).join("")}</div>
      <div class="row" style="justify-content:flex-end"><button class="primary" id="saveself" disabled>Save grade</button></div>
    </section>
    <aside class="panel" style="display:flex;flex-direction:column;gap:12px"><p class="label">Your notes</p>${notesList(C, I, "None.")}</aside>
  </div>`;
  window.scrollTo(0, 0);
  const done = $("#saveself");
  app.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    picks[b.dataset.r] = b.dataset.v;
    app.querySelectorAll(`[data-r="${b.dataset.r}"]`).forEach(x => x.classList.toggle("on", x === b));
    done.disabled = C.rubric.some(r => !picks[r.id]);
  });
  done.onclick = () => {
    const br = [...app.querySelectorAll("[data-b]:checked")].map(x => C.breaches[+x.dataset.b]);
    finishIntake(C, I, { by: "self", criteria: C.rubric.map(r => ({ id: r.id, verdict: picks[r.id], evidence: "", ref: "" })),
      wrong: [], breach: br.join(" "), highlights: [], improvements: [], narrative: "" });
  };
}

function finishIntake(C, I, g) {
  I.grade = g; I.stage = "debrief";
  S.drills.advice[C.id] = Math.max(intakeResult(C, I).pct, S.drills.advice[C.id] ?? 0);
  save(); render(); window.scrollTo(0, 0);
}

function renderDebrief(C, I) {
  const g = I.grade, R = intakeResult(C, I), reg = id => C.registry.find(a => a.id === id);
  const col = R.band === "Excellent" || R.band === "Good" ? "var(--good)" : R.band === "Satisfactory" ? "var(--warn)" : "var(--bad)";
  const bullets = (title, xs) => xs.length ? `<div><strong class="small">${title}</strong><ul>${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
  app.innerHTML = `
  <header class="mast">
    <div><p class="label">Partner's debrief · ${esc(C.subject)}</p><h1>${esc(C.title)}</h1>
      <p class="muted small">${g.by === "claude" ? "Graded by Claude against the case rubric" : "Self-graded"} · Facts ${R.fp.found} of ${R.fp.total} critical · ${fmtMin(I.minutes || 0)} billed · ${(I.docs || []).length} document${(I.docs || []).length === 1 ? "" : "s"}</p></div>
    <div class="row"><button id="back">Back to cases</button><button class="primary" id="again">Meet the client again</button></div>
  </header>
  ${g.breach ? `<p class="breach" style="margin-bottom:18px">Safety breach: ${esc(g.breach)} Your rating is capped at Borderline.</p>` : ""}
  <section class="panel card-score">
    <div class="big" style="color:${col}">${R.pct}%</div>
    <div style="display:flex;flex-direction:column;gap:8px"><p><strong>${R.band}</strong> <span class="small muted">· fact-gathering ${R.facts}/20 · advice ${R.pct - R.facts}/80</span></p>
      <p class="small muted">Excellent ≥ 85 · Good ≥ 70 · Satisfactory ≥ 55 · Borderline ≥ 40</p></div>
  </section>
  ${g.narrative || g.highlights.length || g.improvements.length ? `<section class="grade" style="margin-bottom:8px">
    ${g.narrative ? `<p>${esc(g.narrative)}</p>` : ""}${bullets("What worked", g.highlights)}${bullets("Fix next time", g.improvements)}${bullets("Wrong or inapplicable bases", g.wrong)}
  </section>` : ""}

  <div class="sect"><h2>Rubric</h2></div>
  ${R.rows.map(r => `<article class="qres">
    <div class="hd"><h3>${esc(r.label)}</h3><span class="pill ${r.verdict === "met" ? "good" : r.verdict === "partial" ? "warn" : "bad"}">${r.verdict === "partial" ? "Partly met" : r.verdict === "met" ? "Met" : "Missed"} · ${r.weight * VERDICT[r.verdict]}/${r.weight}</span></div>
    <p class="small muted">${esc(r.domain)} · Met when: ${esc(r.met)}</p>
    ${r.evidence ? `<p class="small">${esc(r.evidence)}</p>` : ""}
    ${r.ref && reg(r.ref) ? `<p class="small"><strong>${esc(reg(r.ref).cite)}</strong>: ${esc(reg(r.ref).text)}</p>` : ""}
  </article>`).join("")}

  <div class="sect"><h2>Your advice and the model</h2></div>
  <div class="answer">${esc(I.advice)}</div>
  <details style="margin-top:12px" open><summary>Model advice</summary><p class="key">${esc(C.model)}</p></details>
  <details style="margin-top:12px"><summary>Authorities for this case</summary>${C.registry.map(a => `<p class="key"><strong>${esc(a.cite)}</strong>: ${esc(a.text)}</p>`).join("")}</details>

  <div class="sect"><h2>Facts</h2></div>
  ${C.facts.map(f => {
    const got = I.revealed.includes(f.id);
    return `<article class="qres">
      <div class="hd"><h3>${esc(f.short)}</h3><span class="pill ${got ? "good" : f.critical ? "bad" : "idle"}">${got ? "Elicited" : f.critical ? "Missed · critical" : "Missed"}</span></div>
      <p class="small">${esc(f.note)}</p>
    </article>`;
  }).join("")}
  <p class="small muted" style="margin-top:22px">Practice cases, not legal advice. Verify each rule against the official text before relying on it.</p>`;

  $("#back").onclick = () => { S.intake = null; home(); };
  $("#again").onclick = () => startIntake(C.id);
}

render();
</script>
