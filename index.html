      "q": "The government owned a 12-hectare land in Cavite classified as forest land. Informal settlers built shanty houses on the land since it was flat and there were no trees planted thereon. In 2023, the government decided to plant Narra trees on the land and demanded that the informal settlers vacate the same. A, owner of one of the shanty houses, refused, claiming that he already owned the portion of the property he was occupying by virtue of acquisitive prescription. Is the claim of A meritorious? Decide with reason(s).",
      "key": "No, the claim of A is not meritorious. Forest land cannot be acquired by acquisitive prescription.\n\nUnder the Civil Code, property is classified as either of public dominion or of private ownership. Property of the public dominion, which includes forest land, is beyond the commerce of man and not susceptible of private appropriation and acquisitive prescription. Occupation in the concept of owner, no matter how long, cannot ripen into ownership and be registered as a title. Unless public land is shown to have been reclassified as alienable or disposable to a private person by the State, it remains part of the inalienable public domain.\n\nHere, an informal settler, A, claims ownership of the property through acquisitive prescription. However, as forest land, the property is considered part of the public domain and is inalienable. Lands of public dominion, by their very nature, cannot be the subject of private appropriation or acquisitive prescription, regardless of the length of occupation or the absence of trees on the surface. Hence, A's claim of ownership by acquisitive prescription over a portion of the government's forest land is without merit. [Article XII, Section 3, 1987 Constitution; Articles 419 and 420(2), Civil Code; Federation of Coron, Busuanga, Palawan Farmer’s Association, Inc. v. Secretary of DENR, G.R. No. 247866, 15 September 2020; Republic v. Pasig Rizal Co., Inc., G.R. No. 213207, 15 February 2022].",

      "q": "A borrowed money from B in the amount of PHP 100,000.00. C, a good friend of A, issued a promissory note in favor of B, binding herself to pay the loan of A on its due date. Was there a novation of the loan agreement between A and B? Reason(s).",
      "key": "No, there was no novation of the loan agreement between A and B.\n\nArticle 1293 of the Civil Code provides that novation, which consists in substituting a new debtor in the place of the original one, may be made even without the knowledge or against the will of the latter, but not without the consent of the creditor.\n\nEven if B accepted the promissory note, there appears to be no consent to the substitution of the person of the debtor A. Thus, there was no novation even if B accepted the promissory note issued by C.\n\n\nALTERNATIVE ANSWER:\n\nNo, because the promissory note did not expressly or impliedly release B from her loan with A.\n\nCase law provides that novation may be express, when it is declared in unequivocal terms that the old obligation is extinguished by a new one which substitutes the same, or implied or tacit, when the old and the new obligations are incompatible with each other on every point.\n\nHere, the promissory note does not expressly release B from her loan obligation. Neither is the said promissory note incompatible on every point with the loan, because it can be construed that C merely bound herself jointly or severally with B, or as her guarantor.\n\nTherefore, there is no novation because the promissory note does not expressly or impliedly release B from her loan obligation to A. [Yujuico v. Far East Bank and Trust Company, G.R. No. 186196, 15 August 2018 (Per J. Caguioa, Second Division); Garcia v. Llamas, G.R. No. 154127, 8 December 2003 (Per J. Panganiban, First Division)]",

      "q": "A, upon request, lent his white van to his friend, B, to drive his wife C from Tarlac to XYZ Medical Center in BGC for treatment. On his way back to Tarlac and after leaving C at the hospital, people flagged the white van, thinking it was a UV Express for hire. B stopped and allowed the people to board and collected payment from them as if the van was a UV Express plying its route. As B was driving along the provincial road, a flash flood wrecked the white van. Is B liable to A for the loss of the white van? Reason(s).",

      "q": "A was adopted by X, the owner of a local chicken and beer restaurant. For several years, X's business had been struggling. To keep the business afloat, X incurred several loans from banks in the total amount of PHP 2.5 million. One day, X figured in an accident which caused his death, leaving A as his sole heir. Upon inventory, X's estate was appraised at PHP 1 million. Subsequently, the estate of X paid the banks the entire value of the estate in the amount of PHP 1 million. But the banks still sued A for the unpaid portion of PHP 1.5 million. Will the action prosper? Decide with reason(s).",

      "q": "A had three children, X, Y, and Z. In her will, A instituted only X and Y as her heirs to her entire estate. She disinherited Z because Z married a drug addict who was disrespectful. Is Z’s disinheritance valid? Reason(s).",
      "key": "No, the disinheritance is not valid.\n\nFor the disinheritance to be valid, the legal cause for the same should be specified in the will. A did not appear to specify the cause for disinheritance in the will, as required by law.\n\nMoreover, one of the requirements for a valid disinheritance of a child or descendant is that the same must be pursuant to a cause expressly stated by law. None of the causes enumerated under the law for the disinheritance of children and descendants is applicable to Z.\n\nIn the given case, the fact that Z married a drug addict who was disrespectful is not a valid ground for the disinheritance of Z. One of the authorized causes for the disinheritance of a descendant is when the latter leads a dishonorable or disgraceful life. In this case, it was not Z who lived a dishonorable or disgraceful life. Instead, it was only the spouse of Z who may be considered guilty of leading a dishonorable or disgraceful life. Hence, the disinheritance of Z is not valid (Articles 915, 916, and 919, NCC).",

      "q": "X hired Y as her driver for her daily commute to work. One Monday, X woke up an hour late. To get to work on time, she instructed Y to step on the pedal and drive fast. She also threatened to fire him if she got to work late or if he damaged her brand-new car during the drive. Afraid to lose his job, Y beat a red light along Osmeña Avenue. As a result, he hit a motorcycle, resulting in the death of the motorcycle driver. The bereaved family of the victim sued both X and Y for damages. X raised the defense that she was merely a passenger. As such, she could not be held liable for Y’s negligence. Is X correct? Reason(s).",
      "key": "No, X is not correct.\n\nUnder the Civil Code, employers are liable for damages caused by their employees acting within the scope of their assigned tasks. To escape this vicarious liability, the employer must prove that they observed the diligence of a good father of a family to prevent damage. In addition, the Civil Code provides that in motor vehicle mishaps, the owner is solidarily liable with the driver, if the former, who was in the vehicle, could have, by the use of due diligence, prevented the misfortune.\n\nHere, X was a passenger when the accident happened. She instructed Y to step on the pedal and drive fast. She also threatened to fire Y if she arrived late to work or if Y damaged her vehicle. X did not use due diligence to prevent the accident but actively influenced Y’s conduct that resulted in the accident. Hence, as X did not exercise due diligence, X can be held solidarily liable with Y (Articles 2180 and 2184, NCC).",

      "key": "No, B cannot validly demand that C split A’s estate in half between them.\n\nArticle 1009 provides that should there be neither brothers nor sisters nor children of brothers or sisters, the other collateral relatives shall succeed to the estate. Thus, in intestate succession, cousins will only inherit in the absence of brothers, sisters, and children of brothers or sisters. Since B is a sister, she is entitled to the entire amount.\n\nAlso, under Article 962 of the Civil Code on the rule of proximity, relatives nearest in degree exclude the more distant ones, saving the right of representation when proper. Here, C, the sister of A, being the nearest in degree, excludes B, the cousin, from inheriting from A’s intestate estate. C alone is entitled to the whole estate of A.",

      "key": "Yes, B is correct that the real estate mortgage was void since he did not consent to the real estate mortgage.\n\nSince A and B were married in 1991 without a marriage settlement, their property regime is absolute community of property. Moreover, since the three parcels of land were acquired during their marriage, it is presumed to be a community property.\n\nUnder Article 96 of the Family Code, the administration and disposition of community property must be exercised jointly by both spouses. Any disposition or encumbrance made without the consent of the other spouse is void, but it will remain an existing offer that can be later validated by B by giving his consent before the offer is withdrawn by B or PCB.\n\nWhen A forged B’s signature to obtain a loan from PCB and constituted a mortgage, she acted without B’s consent. Consequently, the foreclosure and subsequent sale of the lands to PCB are also void. (Articles 75, 93, and 96, Family Code; Philippine National Bank v. Reyes, Jr., G.R. No. 212483, 5 October 2016).",

      "q": "A entered into a contract of sale conveying a house and lot in favor of B. Unwilling to pay thousands of pesos for notarization fees, A and B decided not to have the contract of sale notarized. B nonetheless made C, her nephew, a 2nd year law student, check the contract. C informed his aunt that the sale was void because it was not in a public instrument. He thus advised her to file a case in court to declare the contract of sale void. Is C correct? Reason(s).",

      "q": "On October 18, 2022, the Supreme Court En Banc promulgated the Rule on International Child Abduction Cases (Rule) which implements the Hague Convention on the Civil Aspects of International Child Abduction of 1980. The Rule provides an expeditious procedure to facilitate the prompt return of children who have been wrongfully removed or retained across international boundaries to their state or country of habitual residence. This is based on the presumption that, save in exceptional circumstances, the wrongful removal or retention of the children is not in their best interests. Which of the Guiding Principles and Outcomes under the Supreme Court’s Strategic Plan for Judicial Innovations 2022-2027 (SPJI) are sought to be achieved by this Rule? Briefly explain your answer.",

      "q": "Due to the rising number of killings which resulted from the implementation of the Oplan Krimen of the Philippine National Police (PNP), members of the Integrated Bar of the Philippines (IBP) Quezon City Chapter filed with the Court of Appeals a petition for the issuance of a writ of continuing mandamus. Through this writ of continuing mandamus, they sought to compel officials of the PNP to protect the people, prevent violations of the right to life, and conduct thorough investigations into the killings resulting from the implementation of Oplan Krimen. Is the petition proper? Reason(s).",
      "key": "The petition for continuing mandamus will not prosper.\n\nThe current rule allowing for writs of continuing mandamus is A.M. No. 09-6-8-SC, or the Rules of Procedure for Environmental Cases. Writs of continuing mandamus are “issued by a court in an environmental case directing any agency or instrumentality of the government or officer thereof to perform an act or series of acts decreed by final judgment which shall remain effective until judgment is fully satisfied.” Thus, the writ of continuing mandamus is available only in environmental cases.\n\nHere, the petition that the IBP filed before the Court of Appeals is not an environmental case. The petition pertains to the rising number of killings that resulted from the implementation of the Oplan Krimen of the Philippine National Police. Thus, the writ of continuing mandamus, as formulated in A.M. No. 09-6-8-SC, will not cover the problem sought to be addressed by the petition filed by the IBP. (Baquirin v. dela Rosa, G.R. No. 233930, 11 July 2023)",

      "q": "On behalf of her minor child C, A filed a complaint for support against B. In her complaint, A alleged that B was the biological father of her child, C. After due proceedings, the trial court granted A’s application for DNA testing. Based on the results thereof, the value of the Probability of Paternity between B and C is 99.9%. A offered in evidence the DNA results and rested her case. B claimed that since the Probability of Paternity is not 100% certain, the same cannot be given probative weight. Decide with reason(s).",

      "q": "A filed a petition for correction of entry in her birth certificate, specifically her father’s name from X to Y. The petition impleaded as respondents the Local Civil Registrar of Quezon City and the Chairperson of the Philippine Statistics Authority. The Office of the Solicitor General moved to dismiss the petition for A’s failure to implead X, Y, her mother Z, and all her siblings who should be notified of the proceedings and given the opportunity to come forward and interpose their objections, if any. A opposed the motion, arguing that publication of the petition was sufficient notice to the world, including the aforenamed persons. Decide with reason(s).",
      "key": "The motion of the Office of the Solicitor General (OSG) must be granted. A petition for correction of an entry involving substantial changes is adversarial in nature. The Rules of Court thus provide that the civil registrar and all persons who have a claim or any interest which would be affected by the correction of the entry shall be made parties to the proceeding. The fact that the notice of hearing was published in a newspaper of general circulation and notice thereof was served upon the State will not change the nature of the proceedings taken. Here, the petition filed by A to change the name of his father from X to Y is substantial in nature since it will change her paternity and family relationships. Hence, there is a need to implead X, Y, her mother Z, and her siblings since they are indispensable parties who will be affected by the prayed correction. (Republic v. Timario, G.R. No. 234251, 30 June 2020)\n\n(For the Examiner: The panel respectfully recommends that additional points be given to answers that note that the publication of the petition shall only cure the failure to implead, under special circumstances, where the petitioner exerted earnest efforts to bring to court all possible interested parties.)",

      "key": "Yes, RTC-City of Manila correctly denied A’s application for bail. Any person in custody who is not charged in court may apply for bail with any court of the place where he is held. Since A has already been charged with estafa in RTC-Iloilo City, she can no longer apply for bail with RTC-City of Manila. (Section 17, Rule 114; Altobano- Ruiz v. Pichay, A.M. No. MTJ-17-1893, 19 February 2018)",

      "q": "A was arrested for carnapping B’s car. During the investigation, A executed an extrajudicial confession admitting the crime and implicating C and D as his coconspirators. As a result, C and D were also arrested. During the trial, C and D objected to the admission of A’s extrajudicial confession as against them, but the objection was overruled. The trial court eventually rendered a verdict of conviction against A, C, and D, using as its sole basis A’s extrajudicial confession. Is the verdict of conviction correct? Reason(s).",
      "key": "The verdict of conviction is not correct.\n\nSection 3, Rule 133 of the 2019 Rules on Evidence provides that “an extrajudicial confession made by an accused shall not be sufficient ground for conviction, unless corroborated by evidence of corpus delicti.” Furthermore, Section 29 of the same Rule provides that the “rights of a party cannot be prejudiced by an act, declaration, or omission of another.” This is the res inter alios acta rule.\n\nHere, the Court cannot convict A solely based on his extrajudicial confession. The said confession must be corroborated with corpus delicti, which is absent in the problem. With more reason, the Court cannot convict C and D on the sole basis of the extrajudicial confession of A. The extrajudicial confession of A is inadmissible against C and D due to a violation of the res inter alios acta rule.",
      "origin": "2025 Bar · Remedial Law, Legal and Judicial Ethics · Q7",
      "keyLabel": "UP BRI suggested answer",
      "kw": "extrajudicial confession res inter alios acta",
      "cases": [],
      "noCases": "The suggested answer cites no case; it rests on constitutional, statutory or procedural provisions."
    },

      "pts": 5,
      "q": "In a civil case for a sum of money entitled X v. Y, the Regional Trial Court (RTC) ruled in favor of plaintiff X. The decision became final. A writ of execution was consequently issued. Sheriff Z immediately conducted a public auction for the sale of Y’s real properties to satisfy the money judgment in the amount of PHP 765,159.55. Y filed a complaint to nullify the sale of the real properties, arguing that the same did not follow the order of preference of levy for the satisfaction of the money judgment. Decide with reason(s).",
      "key": "The complaint to nullify the sale of the real properties is meritorious.\n\nUnder the Rules, in the execution of judgments for money, the officer shall demand from the judgment obligor the immediate payment of the full amount stated in the writ of execution and all lawful fees. The judgment obligor shall pay in cash, certified bank check payable to the judgment obligee, or any other form of payment acceptable to the judgment obligee.\n\nConsequently, if the judgment obligor cannot pay all or part of the obligation in cash, certified bank check or other mode of payment acceptable to the judgment obligee, the officer shall levy upon the properties of the judgment obligor of every kind and nature whatsoever which may be disposed, of for value and not otherwise exempt from execution giving the latter the option to immediately choose which property or part thereof may be levied upon, sufficient to satisfy the judgment. If the judgment obligor does not exercise the option, the officer shall first levy on the personal properties, if any, and then on the real properties if the personal properties are insufficient to answer for the judgment. (Section 9, Rule 39, Rules of Court)\n\nIn Son v. Leyva (A.M. No. P-11-2968, 28 November 2019), the Supreme Court held that the rule commands that the executing officer shall enforce the judgments for money in this order: first, the officer must demand from the judgment obligor to pay in cash the judgment obligation; second, if the judgment obligor fails to pay in cash, the officer shall proceed to levy on the personal properties of the judgment obligor; and third, if there are no personal properties, the officer shall then levy on the real properties of the judgment obligor.\n\nHere, when the decision in a civil case for sum of money in favor of plaintiff X became final, a writ of execution was consequently issued and Sheriff Z immediately conducted a public auction for the sale of Y’s real properties to satisfy the money judgment in the amount of PHP 765,159.55, without first attempting to demand from Y the payment of the judgment obligation nor levy Y’s personal properties.\n\nEvidently, Sheriff Z erred in immediately conducting a public auction for the sale of Y’s real properties to satisfy the money judgment without following the order of preference of levy for the satisfaction of the money judgment under the Rules.\n\nHence, the complaint to nullify the sale of the real properties is proper.",
      "origin": "2025 Bar · Remedial Law, Legal and Judicial Ethics · Q8",
      "keyLabel": "UP BRI suggested answer",

      "q": "In a case for sum of money filed by A against PT Production Company (PTPC), the latter was declared in default for filing its answer one day late. In its motion to lift the order of default, PTPC explained that the belated filing of the answer was due to sheer inadvertence, for which it asked the court’s consideration in the interest of substantial justice. The trial court, however, denied the motion, stating that the reglementary period for filing the answer must be strictly followed. PTPC thereafter went to the Court of Appeals on a petition for certiorari, charging the trial judge with grave abuse of discretion amounting to lack or excess of jurisdiction for upholding technicalities over substantial justice. In his comment, A argued that the petition for certiorari should be dismissed for being an improper remedy. According to him, the correct remedy is appeal after the trial court shall have already rendered a judgment on the merits. Decide with reason(s).",
      "key": "I will rule in favor of PTPC.\n\nA petition for certiorari is a proper remedy to question the denial of the motion to lift the order of default if PTPC can show that there was grave abuse of discretion on the part of the trial judge in denying its motion. Still, PTPC should first file a motion for reconsideration of the Order denying the motion to lift the order of default before resorting to a Rule 65 Petition. The remedy for an interlocutory order is certiorari.\n\nWhile it may be correct that an appeal from the judgment on the merits is available to a defendant who has been declared in default, the propriety of the denial of the motion to lift the order of default would be rendered moot following a judgment on the merits. (NPC v. Baysic, G.R. No. 213893, 25 September 2019, citing Martinez v. Republic, 536 Phil. 868, 876-877, 2006)",

      "q": "A filed with the Metropolitan Trial Court (MeTC)-Makati City a collection suit against B for unpaid rentals of his condominium unit in Bonifacio Global City in the amount of PHP 1 million. After service of summons and hearing pursuant to the Rules on Expedited Procedures, the MeTC rendered judgment in favor of A. B filed an ordinary appeal with the Regional Trial Court (RTC). Is the appeal proper? Reason(s).",

      "q": "A filed against her estranged husband X a petition for custody of B before the Regional Trial Court (RTC)-Quezon City where X lived together with B. When X learned of the petition, he, together with B, moved to another residence in Iloilo City. When A found out what X did, she again filed a petition for custody of B before RTC-Iloilo City. When X learned of this second case, he once again changed residence, this time, in Zamboanga City. A then resorted to a petition for habeas corpus against X to produce the live person of B before the Court of Appeals. A alleged that X was illegally restraining B, and withholding from her custody over their child. Was A’s resort to habeas corpus before the Court of Appeals justified? Reason(s).",
      "key": "Yes, A was correct. Family courts have concurrent jurisdiction with the Court of Appeals and the Supreme Court in petitions for habeas corpus where the custody of minors is at issue. The petition may be filed with the Court of Appeals or with any of its members, and if so granted, the writ shall be enforceable anywhere in the Philippines. A was thus correct to file a habeas corpus petition to secure custody over her child B with the Court of Appeals, which had concurrent jurisdiction with the family courts over such a petition. (Section 20, A.M. No. 03-04-04-SC; Thornton v. Thornton, G.R. No. 154598, 16 August 2004)\n\nALTERNATIVE ANSWER:\n\nNo, A’s resort to habeas corpus before the Court of Appeals is not justified. In the case of Reyes v. Elquiero (G.R. No. 210487, 2 September 2020), in consideration likewise were a petition for custody that was filed with the trial court and a petition for habeas corpus that was filed with the Court of Appeals. The Supreme Court first declared therein that forum shopping is prohibited. It added that there is forum shopping when the same subject matter, parties, and relief are involved, albeit packaged in different forms. Here, the three petitions involve the same subject matter and parties. There is likewise the same relief prayed for in all said petitions, that is, for A to secure custody of B. Considering that there is forum shopping, resorting to habeas corpus is therefore unjustified.",

      "q": "A filed with the Municipal Trial Court in Cities (MTCC)-Davao City, a complaint for recovery of ownership of real property against B. After A presented his evidence, B filed a motion to dismiss on the ground of lack of jurisdiction since the assessed value of the property in the amount of PHP 10 million was beyond the jurisdictional threshold of the MTCC. A argued that the motion to dismiss should be denied since B was deemed to have waived such jurisdictional defect when he failed to plead the same as an affirmative defense in his answer. Is A correct? Reason(s).",

      "q": "A was charged with murder for the death of his neighbor, B. Upon a finding of probable cause, the presiding judge of Branch 31, Regional Trial Court-Makati City, issued a warrant of arrest on A. Police Corporal X (PCPl X) and Warrant Officer Police Staff Sergeant (PSSg) Y implemented the warrant of arrest on A without using body-worn cameras and one alternative recording device. A argued that the implementation of the warrant of arrest was unlawful since the Rules on the Use of Body-Worn Cameras in the Execution of Warrants was not observed. Is A correct? Reason(s).",
      "key": "A is not correct.\n\nThe non-compliance with the Rules on the Use of Body-Worn Cameras in the implementation of a warrant of arrest will not make the arrest unlawful. Section 5, Rule II of the Rules on the Use of Body-Worn Cameras provides that “failure to observe the requirement of using body-worn cameras or alternative recording devices shall not render the arrest unlawful or render the evidence obtained inadmissible xxx.”\n\nThus, while the police officers who implemented the warrant of arrest did not use body-worn cameras or an alternative recording device, the non-compliance will not make the arrest invalid.\n\nALTERNATIVE ANSWER:\n\nA is correct.\n\nEnforcement of a warrant of arrest without a body-worn camera violates Rule 2, Sections 1 and 3 of AM 21-06-08-SC (Rule on the Use of Body Worn Cameras in the Execution of Warrants).\n\nHowever, the arrest remains valid pursuant to Rule 2 Section 5 because failure to observe the requirement of using body-worn cameras or alternative recording devices shall not render the arrest unlawful or render the evidence obtained inadmissible.\n\nFacts surrounding the arrest may be proved by the testimonies of the arresting officers, the person arrested, and other witnesses to the arrest.\n\nHowever, a law enforcement officer who fails, without reasonable grounds, to use body-worn cameras or alternative recording devices, or intentionally interferes with the body-worn cameras’ ability to accurately capture audio and video recordings of the arrest, or otherwise manipulates such recording during or after the arrest, may be liable for contempt of court.",

      "q": "Armed with a search warrant, police officers searched the house of A for firearms and ammunition in his presence and in the presence of two barangay officials. One of the police officers found a black basin containing some clothes in A’s bedroom. When the clothes were removed from the basin, a .38 caliber revolver and six pieces of live ammunition were discovered. Based on this, A was charged with illegal possession of firearms and ammunition. Before the arraignment, he assailed the validity of the search warrant for alleged lack of any records indicating that the judge conducted searching questions and answers for the purpose of determining probable cause. The prosecution nonetheless invoked the presumption of regularity in the performance of official duty. Decide with reason(s).",
      "key": "The search warrant was invalid. Under Section 2, Article III of the Constitution and Section 5, Rule 126 of the Rules of Court, a search warrant may be issued only upon probable cause personally determined by the judge after conducting an examination under oath of the complainant and the witnesses he may produce. Such examination must consist of searching questions and answers, and the sworn statements or affidavits must form part of the record. In the present case, the records are bereft of any showing that the issuing judge personally and thoroughly examined the applicant and his witnesses.\n\nFurthermore, the constitutional protection against unreasonable searches and seizures depends on a valid finding of probable cause, which must be supported by sufficient facts. The Court has ruled that if there is no record showing how the judge determined probable cause, such a determination is contrary to the proper performance of duty and disproves any claim that the judge made a thorough and careful examination of the witnesses. (Abiang v. People, G.R. No. 265117, 13 November 2023, citing Ogayon v. People, 768 Phil. 272, J. Lazaro-Javier)\n\nMoreover, the presumption of regularity in official acts is rebuttable by any record or evidence of irregularity and cannot override the accused’s presumption of innocence or right to challenge probable cause.\n\nHere, A assailed the validity of the search warrant before arraignment, for alleged lack of any records indicating that the judge conducted searching questions and answers for the purpose of determining probable cause. Hence, the search warrant is invalid.",

      "q": "A charged Atty. X with violation of the 2004 Rules on Notarial Practice for notarizing a Unilateral Deed of Absolute Sale and an Affidavit of Confirmation of Sale where the vendee was Atty. X’s paternal uncle, Y. Atty. X countered that since his uncle was not a signatory to the said documents, he was not disqualified from performing a notarial act under Rule IV, Section 3 of the 2004 Rules on Notarial Practice. Is the contention of Atty. X correct? Reason(s).",
      "key": "Atty. X is incorrect. Under the 2004 Rules on Notarial Practice, a notary public is disqualified from performing a notarial act if he or she ·is a spouse, common-law partner, ancestor, descendant, or relative by affinity or consanguinity of the principal within the fourth civil degree. Here, Y, the paternal uncle of Atty. X, is the vendee in the Unilateral Deed of Absolute Sale and an Affidavit of Confirmation of Sale. Despite Y’s lack of signature in these documents, he remains a “principal” party to the deed of absolute sale and its confirmatory document. Notarizing a document where one of the contracting parties is a relative within the fourth civil degree is a violation of the 2004 Rules on Notarial Practice. Thus, the prohibition in the rules of notarial practice still applied to Atty. X. (Spouses Tan v. Vallejo, A.C. No. 11219, 16 March 2022)",

      "q": "Based on the results of the judicial audit of the cases assigned to Judge X, it was discovered that he had 44 pending cases which he failed resolve within the prescribed three-month period. It was confirmed that he did not request from the Supreme Court any additional time to act on these cases. The oldest of these cases had been pending with his court for 13 years already. In his defense, he claimed that he was sickly and was in and out of the hospital. It was for this reason that he was unable to promptly resolve his cases. Is Judge X guilty of gross inefficiency? Reason(s).",
      "key": "Yes, Judge X is guilty of gross inefficiency. Rules prescribing the time within which certain acts must be done are indispensable to prevent needless delays in the orderly and speedy disposition of cases. Thus, the 90-day period is mandatory. The speedy disposition of cases in our courts is a primary aim of the judiciary, so that the ends of justice may not be compromised and the judiciary will be true to its commitment to provide litigants their constitutional right to speedy trial and speedy disposition of their cases.\n\nThe honor and integrity of the judicial system are measured not only by the fairness and correctness of decisions rendered, but also by the efficiency with which disputes are resolved.\n\nThus, judges must perform their official duties with utmost diligence if public confidence in the judiciary is to be preserved. There is no excuse for mediocrity in the performance of judicial functions. The position of judge exacts nothing less than faithful observance of the law and the Constitution in the discharge of official duties. (Office of the Court Administrator v. Judge Victor Teves, Sr., A.M. No. RTJ-21-2606, 09 February 2021, Second Division, Lazaro-Javier, J.)",

      "q": "Under Resolution dated November 12, 2023, the Supreme Court found Atty. X liable for breach of the sub judice rule and imposed on him the penalty of suspension from the practice of law for six months, effective immediately. On May 20, 2024, Atty. X submitted to the Supreme Court a sworn statement declaring, among others, that he desisted from the practice of law during his six-month suspension beginning November 12, 2023 when he received the Resolution until May 12, 2024. May Atty. X resume his practice of law? Reason(s).",
      "key": "Yes, Atty. X may resume his practice of law. Pursuant to Canon VI, Section 45 of the Code of Professional Responsibility and Accountability, upon expiration of suspension from the practice of law, the lawyer shall file a Sworn Statement with the Supreme Court through the Office of the Bar Confidant. Such a statement shall indicate the date of the lawyer’s receipt of the order imposing such suspension. Canon VI, Section 46 provides that the Sworn Statement is considered proof of the suspended lawyer’s compliance with the suspension order, and that the lawyer is allowed to resume practice of law upon filing the Sworn Statement. The Court’s confirmation is not required for the resumption of practice, as clarified in A.C. No. 11032 (10 January 2023) against Atty. Severo Brillantes, further affirmed in A.C. No. 12443 (23 August 2023) against Atty. Winston Hipe. Thus, Atty. X may resume his practice of law upon filing his sworn statement, without waiting for the Court’s confirmation.\n\nIn AC No. 11032, however, the Supreme Court warned that “(W)hile the lifting of administrative suspensions has now been made faster and more efficient, this does not mean that the Court will be similarly liberal to those who would submit false certifications or otherwise exploit the process.”",

      "q": "A sued B for specific performance and damages. After the issues have been joined, the Regional Trial Court-City of Manila set the pre-trial conference of the case on November 16, 2025. Draft a special power of attorney, authorizing Atty. X to represent A as his attorney-in-fact during the pre-trial conference. Omit both caption and acknowledgment.",

    {
      "pts": 5,
      "q": "On April 11, 2023, the Court En Banc approved the Guidelines on Submission of Electronic Copies of Pleadings and Other Court Submissions (Guidelines), which governs the electronic transmittal in PDF of pleadings and other court submissions 6 and their accompanying documents for filing in all cases covered by the Rules of Civil Procedure, as amended. What Guiding Principle(s) and expected Outcome(s) of the Strategic Plan for Judicial Innovations 2022-2027 (SPJI) propelled the adoption of this innovation? Briefly explain your answer.",

function weighted() {
  const done = SUBJECTS.filter(s => S.scores[s.id] != null);
  if (!done.length) return null;
  const w = done.reduce((a, s) => a + s.weight, 0);
  return { avg: done.reduce((a, s) => a + s.weight * S.scores[s.id], 0) / w, done: done.length, full: done.length === SUBJECTS.length };
}

function render() {
  clearInterval(tick);

  if (S.view === "report" && S.report) return renderReport();

async function startExam(id) {
  let qs = BANK[id];

    minutes: review ? null : S.duration, strict: S.strict, tabSwitches: 0 };
  S.view = "exam"; confirmSubmit = false; save(); render(); window.scrollTo(0, 0);
}

/* ---------- Exam ---------- */
function fmt(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

const verdict = (g, pts) => {
  const r = g.score / pts;
  return r >= .75 ? ["good", "Correct"] : r >= .5 ? ["warn", "Partly correct"] : ["bad", "Incorrect"];
};

function gradeBlock(g) {
  return `<div class="grade">
    <p class="label">${g.by === "claude" ? "Graded by Claude" : "Self-graded"}</p>
    ${notionBadge(g)}
    ${g.comment ? `<p>${esc(g.comment)}</p>` : ""}
    ${g.missed?.length ? `<div><strong class="small">Missed or weak</strong><ul>${g.missed.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div>` : ""}
    ${g.scrubbed ? `<p class="small muted">${g.scrubbed} statement${g.scrubbed > 1 ? "s" : ""} removed for citing law not found in the source answer.</p>` : ""}
  </div>`;
}

function registryBlock(q, key) {
  return `<div class="reg"><p class="label">Cases</p>
    ${q.cases?.length ? `<ul>${q.cases.map(c => `<li><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a> <span class="pill ${c.src === "registry" || !c.src ? "good" : "idle"}">${c.src === "lawphil" ? "Lawphil" : c.src === "external" ? esc(c.label) : "Your registry"}</span></li>`).join("")}</ul>`
      : q.src ? "" : `<p class="small muted">${esc(q.noCases || "No registry case matched this question at 75% confidence.")}</p>`}
    ${q.caseNote ? `<p class="small muted">${esc(q.caseNote)}</p>` : ""}
    ${q.kw ? `<div class="row small"><button data-reg="${key}">Search registry</button><span class="muted">Loose keyword match: “${esc(q.kw)}”. Check each result yourself.</span></div><ul class="small" id="regres-${key}"></ul>` : ""}
  </div>`;
}

function noteBlock(q) {
  return `<details><summary>${q.src ? "Model answer from Notion" : q.keyLabel || "Examiner's note"}</summary><p class="key">${esc(q.key)}</p>${q.src ? `<p class="small"><a href="${esc(q.src.url)}" target="_blank" rel="noopener">Open in Notion</a></p>` : ""}</details>`;
}

function wireRegistry(qs) {
  app.querySelectorAll("[data-reg]").forEach(b => b.onclick = () => searchRegistry(qs[+b.dataset.reg], b, $("#regres-" + b.dataset.reg)));
}

let checking = null, checkNote = "";

function renderExam() {
  const E = S.exam, s = subj(E.subject), qs = E.qs || BANK[E.subject], q = qs[E.idx];
  const review = E.mode === "review" && !!q.key, g = review ? E.checked[E.idx] : null, last = E.idx === qs.length - 1;
  const answered = E.answers.filter(a => a.trim()).length;
  const busy = checking === E.idx;
  app.innerHTML = `
  <div class="examhead">
    <div style="min-width:0"><p class="label">${s.sched} · ${s.weight}% · ${E.mode === "review" ? "Review mode" : "Bar simulation"}</p><h2>${esc(s.name)}</h2></div>
    <div class="row">${E.mode === "review" ? `<span class="pill idle">Untimed</span>` : `<span class="timer" id="timer" aria-live="off">${fmt(E.endAt - Date.now())}</span>`}

  ${confirmSubmit ? `<div class="confirm" style="margin-top:14px"><p>${E.mode === "review" ? `${E.checked.filter(Boolean).length} of ${qs.length} checked. Finish and see your summary?` : `${answered} of ${qs.length} answered. Submit for grading? You cannot return to this booklet.`}</p>

    ${qs.map((_, i) => `<button data-go="${i}" class="${i === E.idx ? "cur" : ""} ${E.answers[i].trim() ? "done" : ""} ${E.flags[i] ? "flag" : ""}" aria-label="Question ${i + 1}">${i + 1}</button>`).join("")}
  </nav>
  <section style="display:flex;flex-direction:column;gap:14px">
    <div class="row" style="justify-content:space-between"><span class="label">Question ${E.idx + 1} of ${qs.length} · ${q.pts} points</span>
      <button id="flag">${E.flags[E.idx] ? "Unflag" : "Flag for review"}</button></div>
    ${q.src ? `<p class="small muted">From your repository: <a href="${esc(q.src.url)}" target="_blank" rel="noopener">${esc(q.src.title)}</a>${q.src.status !== "Verified" ? ` · <span class="pill warn">${esc(q.src.status || "Unverified")}</span>` : ""}</p>` : ""}
    ${q.origin ? `<p class="small muted">${esc(q.origin)}</p>` : ""}
    <p class="qtext">${esc(q.q)}</p>
    ${E.strict && E.tabSwitches ? `<p class="warnbox">You left the exam window ${E.tabSwitches} time${E.tabSwitches > 1 ? "s" : ""}. In the actual Bar, the exam software logs this.</p>` : ""}
    <label class="label" for="ans">Answer booklet</label>
    <textarea id="ans" class="booklet" spellcheck="false" ${g || busy ? "readonly" : ""} placeholder="State your answer, the legal basis, its application to the facts, and your conclusion.">${esc(E.answers[E.idx])}</textarea>
    <div class="meta"><span id="wc">${words(E.answers[E.idx])} words</span><span class="row" style="gap:8px">${g ? "Checked · answer locked" : review ? "Pressing Next checks this answer" : E.mode === "review" ? "No answer key yet · not graded" : E.strict ? (E.allowPaste ? "Strict mode: paste allowed" : "Strict mode: paste disabled") : "Saved in this browser"}${E.strict && !g ? `<button id="paste" class="small" style="padding:3px 10px">${E.allowPaste ? "Disable paste" : "Enable paste"}</button>` : ""}</span></div>
    ${review && (g || busy || checkNote === "self") ? feedbackPanel(q, g, busy) : ""}

  if ($("#paste")) $("#paste").onclick = () => { E.allowPaste = !E.allowPaste; save(); render(); $("#ans")?.focus(); };

    checkNote = ""; save(); render(); logToNotion(E.subject, q, E.answers[E.idx], E.checked[E.idx], "review");
  });
  wireRegistry(qs.map((x, i) => i === E.idx ? x : null));

  if (E.mode !== "review") {
    const t = $("#timer");
    tick = setInterval(() => {
      const left = E.endAt - Date.now();
      t.textContent = fmt(left);
      t.classList.toggle("low", left < 5 * 60000);
      if (left <= 0) finishExam();
    }, 500);
  }
}

function feedbackPanel(q, g, busy) {
  const E = S.exam;
  if (busy) return `<div class="panel feedback"><p class="muted">Claude is checking your answer…</p></div>`;
  if (!g) return `<div class="panel feedback">
      <p><strong>Compare your answer with the note below, then mark it.</strong> <span class="small muted">Claude grading isn't available here.</span></p>
      ${noteBlock(q).replace("<details>", "<details open>")}
      <div class="row"><button data-selfmark="1">I got it right</button><button data-selfmark="0.5">Partly right</button><button data-selfmark="0">I missed it</button></div>
      ${registryBlock(q, E.idx)}
    </div>`;
  const [cls, label] = verdict(g, q.pts);
  return `<div class="panel feedback">
      <div class="hd row" style="justify-content:space-between"><span class="pill ${cls}" style="font-size:.9rem">${label}</span><span class="small muted">${g.score} / ${q.pts}</span></div>
      ${gradeBlock(g)}
      ${noteBlock(q).replace("<details>", "<details open>")}
      ${registryBlock(q, E.idx)}
    </div>`;
}

async function checkCurrent() {
  const E = S.exam, i = E.idx, q = (E.qs || BANK[E.subject])[i], a = E.answers[i];
  if (!a.trim()) { E.checked[i] = { score: 0, by: "claude", comment: "No answer was written.", missed: [] }; save(); render(); return logToNotion(E.subject, q, a, E.checked[i], "review"); }
  if (!grader) grader = window.claude?.use ? await window.claude.use("sample").catch(() => null) : null;
  if (!grader) { checkNote = "self"; return render(); }
  checking = i; checkNote = ""; render();
  try {
    E.checked[i] = await gradeAnswer(q, a, subj(E.subject).name);
    logToNotion(E.subject, q, a, E.checked[i], "review");
  } catch (e) {
    const msg = e?.code in ERR ? ERR[e.code] : "Grading failed. Press Next to try again, or mark it yourself.";
    checkNote = msg == null ? "self" : e?.code === "cancelled" ? "" : msg;
    if (msg == null) grader = null;
  } finally { checking = null; }
  save(); if (S.view === "exam" && S.exam === E) render();
}

function markNav() {
  const E = S.exam;
  app.querySelectorAll("[data-go]").forEach(b => b.classList.toggle("done", !!E.answers[+b.dataset.go].trim()));
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden && S.view === "exam" && S.exam?.strict) { S.exam.tabSwitches++; save(); }
  else if (!document.hidden && S.view === "exam") render();
});

function finishExam() {
  clearInterval(tick);
  const E = S.exam, review = E.mode === "review";
  S.report = { subject: E.subject, qs: E.qs || BANK[E.subject], mode: E.mode || "bar", answers: E.answers, tabSwitches: E.tabSwitches, minutes: E.minutes,
    usedMs: review ? Date.now() - E.startedAt : Math.min(E.minutes * 60000, Date.now() - (E.endAt - E.minutes * 60000)),
    grades: review ? E.checked.slice() : E.answers.map(() => null) };
  S.exam = null; S.view = "report"; confirmSubmit = false; checkNote = ""; postScore(); save(); render(); window.scrollTo(0, 0);
}

/* ---------- Report ---------- */
function reportTotal() {
  const R = S.report, qs = R.qs || BANK[R.subject];
  const keyed = qs.map((q, i) => i).filter(i => qs[i].key);
  if (!keyed.length || keyed.some(i => R.grades[i] == null)) return null;
  const got = keyed.reduce((a, i) => a + R.grades[i].score, 0), max = keyed.reduce((a, i) => a + qs[i].pts, 0);
  return got / max * 100;
}

function renderReport() {
  const R = S.report, s = subj(R.subject), qs = R.qs || BANK[R.subject], total = reportTotal();
  const review = R.mode === "review", graded = R.grades.filter(Boolean).length, unkeyed = !qs.some(q => q.key);
  app.innerHTML = `
  <header class="mast">
    <div><p class="label">${review ? "Review summary" : "Examiner's report"} · ${s.sched}</p><h1>${esc(s.name)}</h1>
      <p class="muted small">${review ? `Untimed review · ${fmt(R.usedMs)} spent` : `Time used ${fmt(R.usedMs)} of ${fmt(R.minutes * 60000)}`}${R.tabSwitches ? ` · left the window ${R.tabSwitches}×` : ""}</p></div>
    <button id="back">Back to subjects</button>
  </header>

  <section class="panel card-score">
    <div class="big" style="color:${total == null ? "var(--muted)" : total >= PASS ? "var(--good)" : "var(--bad)"}">${unkeyed ? "—" : total == null ? `${graded}/${qs.length}` : total.toFixed(1) + "%"}</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <p><strong>${unkeyed ? "Not graded" : total == null ? "Questions graded" : review ? "Review score" : "Subject grade"}</strong></p>
      <p class="small muted">${unkeyed ? "This subject has no answer key yet, so your answers are saved here but not scored." : total == null ? "Grade each answer with Claude or score it yourself against the examiner's note." + (review ? "" : " The subject grade posts to your scorecard once every answer has a score.")
        : review ? "Review sittings don't count toward your scorecard. Take a Bar simulation sitting for that." : `Posted to your scorecard at ${s.weight}% weight.`}</p>
      <div class="row" id="bulk"></div>
    </div>
  </section>

  ${qs.map((q, i) => {
    const g = R.grades[i], a = R.answers[i];
    return `<article class="qres" id="q${i}">
      <div class="hd"><h3>Question ${i + 1}</h3>
        <span class="pill ${g ? verdict(g, q.pts)[0] : "idle"}">${g ? `${verdict(g, q.pts)[1]} · ${g.score} / ${q.pts}` : `— / ${q.pts}`}</span></div>
      <p class="qtext small" style="font-size:.97rem">${esc(q.q)}</p>
      <div><p class="label">Your answer · ${words(a)} words</p><div class="answer">${a.trim() ? esc(a) : "<em class='muted'>No answer.</em>"}</div></div>
      ${g ? gradeBlock(g) : q.key ? `<div class="row ai" data-i="${i}"></div>` : ""}
      ${registryBlock(q, i)}
      ${q.key ? noteBlock(q) : ""}
      ${q.key ? `<div class="row small"><label for="self${i}">Score it yourself</label>
        <input type="number" id="self${i}" class="score-in" min="0" max="${q.pts}" step="0.5" value="${g ? g.score : ""}"> <span class="muted">/ ${q.pts}</span>
        <button data-self="${i}">Save score</button></div>` : ""}
    </article>`;
  }).join("")}`;

  $("#back").onclick = () => { S.view = "board"; save(); render(); };
  app.querySelectorAll("[data-self]").forEach(b => b.onclick = () => {
    const i = +b.dataset.self, v = parseFloat($("#self" + i).value), max = qs[i].pts;
    if (isNaN(v)) return;
    const prev = R.grades[i];
    R.grades[i] = { ...(prev || {}), score: Math.max(0, Math.min(max, v)), by: "self" };
    postScore(); save(); render();
    if (!prev?.notion) logToNotion(R.subject, qs[i], R.answers[i], R.grades[i], R.mode);
  });
  wireRegistry(qs);
  wireClaude();
}

async function searchRegistry(q, btn, out) {
  if (!q || !out) return;
  btn.disabled = true; out.innerHTML = "<li class='muted'>Searching your registry…</li>";
  try {
    await mcpReady;
    if (!mcp) throw { code: "no_mcp" };
    const r = await mcp.callTool(NOTION.server, "notion-search", { query: q.kw, data_source_url: REGISTRY.ds, page_size: 5, max_highlight_length: 0 });
    const known = new Set((q.cases || []).map(c => c.url.replace(/\?.*$/, "")));
    const hits = (r?.payload?.results || []).filter(h => h.type === "page" && !known.has(String(h.url).replace(/\?.*$/, "")));
    out.innerHTML = hits.length ? hits.map(h => `<li><a href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title)}</a> <span class="pill idle">loose match</span></li>`).join("")
      : "<li class='muted'>No other registry cases came up.</li>";
  } catch (e) {
    out.innerHTML = `<li class="muted">${esc(notionError(e).replace(/ Using the built-in set[^.]*\./, ""))}</li>`;
  } finally { btn.disabled = false; }
}

function postScore() {
  const t = reportTotal();
  if (t != null && S.report.mode !== "review") S.scores[S.report.subject] = Math.round(t * 10) / 10;
}

/* ---------- Notion source (mcp capability) ---------- */
function notionError(e) {
  const c = e?.code;
  if (c === "no_mcp") return "Notion can't be reached from this view. Using the built-in set.";
  if (c === "server_not_connected" || c === "needs_reauth") return "Connect Notion in claude.ai Settings → Connectors, then try again. Using the built-in set for now.";
  if (c === "not_in_manifest" || c === "approval_required") return "Notion access was not allowed for this page. Using the built-in set.";
  if (c === "empty") return e.message;
  return "Notion did not answer. Using the built-in set; try again in a moment.";
}

function parseNotionPage(p) {
  const text = String(p?.text || "");
  let props = {};
  try { props = JSON.parse((text.match(/<properties>\s*([\s\S]*?)\s*<\/properties>/) || [])[1] || "{}"); } catch {}
  const body = (text.match(/<content>([\s\S]*?)<\/content>/) || [])[1] || "";
  const strip = t => t.replace(/<empty-block\/>/g, "").replace(/<\/?(summary|details)[^>]*>/g, "")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, "$1").replace(/\*\*|\\(?=[$*_\[\]])/g, "").replace(/^\t+/gm, "").replace(/\n{3,}/g, "\n\n").trim();
  const qm = body.match(/##\s*Question\s*\n([\s\S]*?)(?=<details>|\n---|$)/);
  const am = body.match(/<details>([\s\S]*?)<\/details>/);
  return { props, question: qm ? strip(qm[1]) : "", answer: am ? strip(am[1]).replace(/^▸?\s*Doctrine & Model Answer[^\n]*\n?/, "") : "" };
}

async function notionQuestions(id) {
  await mcpReady;
  if (!mcp) throw { code: "no_mcp" };
  const want = NOTION.subjects[id], okStatus = S.includeReview ? ["Verified", "Needs Review"] : ["Verified"];
  const hits = new Map();
  for (const subjectName of want) {
    const r = await mcp.callTool(NOTION.server, "notion-search", { query: subjectName, data_source_url: NOTION.ds, page_size: 25, max_highlight_length: 0 });
    for (const h of r?.payload?.results || []) if (h.type === "page" && !hits.has(h.id)) hits.set(h.id, h);
  }
  const ids = [...hits.keys()].sort(() => Math.random() - .5);
  const picked = [];
  for (let i = 0; i < ids.length && picked.length < S.count; i += 6) {
    const pages = await Promise.all(ids.slice(i, i + 6).map(pid =>
      mcp.callTool(NOTION.server, "notion-fetch", { id: pid }, { cache: { staleTime: 60000 } }).then(r => r.payload).catch(() => null)));
    for (const p of pages) {
      if (!p || picked.length >= S.count) continue;
      const { props, question, answer } = parseNotionPage(p);
      if (!want.includes(props.Subject) || !okStatus.includes(props.Status) || question.length < 40 || !answer) continue;
      picked.push({ q: question, key: answer, kw: props.Question || p.title, src: { title: props.Question || p.title || "Notion question", url: props.url || p.url, status: props.Status, track: props.Track } });
    }
  }
  if (!picked.length) throw { code: "empty", message: `No ${okStatus.join(" or ")} ${want.join(" / ")} questions were found in your Notion repository. Using the built-in set.` };
  const fill = BANK[id].slice(0, Math.max(0, S.count - picked.length));
  if (fill.length) sourceNote = `Found ${picked.length} usable Notion question${picked.length > 1 ? "s" : ""} for this subject; ${fill.length} built-in question${fill.length > 1 ? "s" : ""} fill the rest.`;
  const all = [...picked, ...fill.map(q => ({ q: q.q, key: q.key, cases: q.cases, kw: q.kw }))];
  const base = Math.floor(100 / all.length), extra = 100 - base * all.length;
  return all.map((q, i) => ({ ...q, pts: base + (i < extra ? 1 : 0) }));
}

/* ---------- Progress log: the viewer's Notion "2027 Bar — Performance & Error Log" ---------- */
const PERF = { ds: "cbcc0567-fa25-4f50-89fb-39d14f228c4f", url: "https://app.notion.com/p/8ab4f3bb09a74c9c994c8b325efa1555",
  subject: { pol: "Political & Public International Law", comtax: "Commercial & Taxation Laws", civ: "Civil Law & Land Titles and Deeds",
    lab: "Labor Law & Social Legislation", crim: "Criminal Law", rem: "Remedial Law Ethics and Practical Exercises" } };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

async function logToNotion(subjectId, q, answer, g, mode) {
  if (!S.logNotion || !g || g.notion || !q.key) return;
  g.notion = "pending"; save();
  try {
    await mcpReady;
    if (!mcp) throw { code: "no_mcp" };
    const pct = g.score / q.pts, today = new Date(), retest = new Date(today.getTime() + 864e5);
    const yes = v => (v ? "__YES__" : "__NO__");
    const registry = (q.cases || []).filter(c => c.src === "registry" || !c.src).map(c => c.url);
    const outside = (q.cases || []).find(c => c.src === "lawphil" || c.src === "external");
    const props = {
      Question: `${q.origin || subj(subjectId).name}: ${q.q.slice(0, 90)}${q.q.length > 90 ? "…" : ""}`,
      Subject: PERF.subject[subjectId],
      "Question Type": /^\s*draft\b/i.test(q.q) || /\bDraft (a|the)\b/.test(q.q) ? "Practical Exercise" : "Essay",
      "date:Date:start": ymd(today), "date:Date:is_datetime": 0,
      Score: g.score, "Max Score": q.pts,
      Notes: [`Bar Simulator · ${mode === "review" ? "Review mode" : "Bar simulation"} · ${g.by === "claude" ? "graded by Claude against the source answer" : "self-graded"}`,
        g.comment, g.missed?.length ? "Missed: " + g.missed.join("; ") : ""].filter(Boolean).join("\n"),
    };
    if (g.irac) Object.assign(props, { "Issue Spotted": yes(g.irac.issue), "Rule Accurate": yes(g.irac.rule), "Application Adequate": yes(g.irac.application), "Conclusion Adequate": yes(g.irac.conclusion) });
    if (pct < 0.75) Object.assign(props, { "date:Retest Date:start": ymd(retest), "date:Retest Date:is_datetime": 0 });
    if (registry.length) props.Case = registry;
    if (outside) props["Case / Doctrine Link"] = outside.url;
    const clean = t => String(t || "").replace(/\r/g, "");
    const content = `## Question\n${clean(q.q)}\n\n## My answer\n${clean(answer) || "(No answer written.)"}\n\n## Source answer\n${q.keyLabel || "Model answer"}, shown in the simulator.`;
    const r = await mcp.callTool(NOTION.server, "notion-create-pages", { parent: { type: "data_source_id", data_source_id: PERF.ds }, pages: [{ properties: props, content }] });
    g.notion = r?.payload?.pages?.[0]?.url || "logged";
  } catch (e) {
    g.notion = null; g.notionError = notionError(e).replace(/ Using the built-in set[^.]*\./, "");
  }
  save();
  // Re-render only where the grade is on screen, never under an answer being typed.
  if (S.view !== "exam" || S.exam?.checked?.[S.exam.idx] === g) render();
}

function notionBadge(g) {
  if (!g || !S.logNotion) return "";
  if (g.notion === "pending") return `<span class="small muted">Logging to Notion…</span>`;
  if (g.notion) return `<span class="small muted">Logged to your <a href="${esc(g.notion.startsWith("http") ? g.notion : PERF.url)}" target="_blank" rel="noopener">Performance &amp; Error Log</a></span>`;
  if (g.notionError) return `<span class="small" style="color:var(--warn)">Not logged: ${esc(g.notionError)}</span>`;
  return "";
}

/* ---------- Claude grading (sample capability) ---------- */
const ERR = { not_granted: null, sampling_disabled: null, not_declared: null, capability_disabled: null, capability_removed: null,
  rate_limited: "Claude is busy or your usage limit was reached. Try again later, or score it yourself.",
  session_expired: "Sign in to Claude again to grade.", invalid_json: "The grade came back malformed. Try again.",
  refused: "Claude declined to grade this answer.", };

async function wireClaude() {
  if (!grader) grader = window.claude?.use ? await window.claude.use("sample").catch(() => null) : null;
  if (!grader || S.view !== "report") return;
  const R = S.report;
  app.querySelectorAll(".ai").forEach(el => {
    const i = +el.dataset.i;
    el.innerHTML = `<button class="primary">Grade with Claude</button><span class="small muted"></span>`;
    el.querySelector("button").onclick = () => gradeOne(i, el);
  });
  const qsR = R.qs || BANK[R.subject];
  const pending = R.grades.map((g, i) => g || !qsR[i].key ? -1 : i).filter(i => i >= 0);
  const bulk = $("#bulk");
  if (bulk && pending.length > 1) {
    bulk.innerHTML = `<button class="primary">Grade all ${pending.length} with Claude</button>`;
    bulk.querySelector("button").onclick = async e => {
      e.target.disabled = true;
      for (const i of pending) { const el = app.querySelector(`.ai[data-i="${i}"]`); if (el && !(await gradeOne(i, el, true))) break; }
      render();
    };
  }
}

async function gradeAnswer(q, a, subjectName) {
  const ref = q.key + (q.cases?.length ? "\n\nCases linked to this answer: " + q.cases.map(c => c.title).join("; ") : "");
  const prompt = `You are an examiner for the Philippine Bar Examinations, subject: ${subjectName}. Grade the examinee's answer against the REFERENCE ANSWER only.

Rules:
- The REFERENCE ANSWER (from ${q.src ? "the examinee's own verified question bank" : "a published suggested answer"}) is the sole source of law for this grading. Treat it as correct.
- Do not state, add, or suggest any provision, article, section, rule, statute, doctrine, or case that does not appear in the REFERENCE ANSWER. If the examinee cites law not in the REFERENCE ANSWER, do not credit or discuss it; grade only what matches the reference.
- Do not write your own model or suggested answer.
- Credit the correct conclusion, the legal basis named in the REFERENCE ANSWER, and sound application to the facts. A correct conclusion with no legal basis earns little. Where the reference gives alternative answers, credit an answer that tracks any one of them.
- Do not penalize omitted G.R. numbers when the doctrine from the reference is correctly stated.

QUESTION (${q.pts} points):
${q.q}

REFERENCE ANSWER:
${ref}

EXAMINEE'S ANSWER:
${a.slice(0, 12000)}

Reply with only a JSON object:
{"score": number from 0 to ${q.pts} in steps of 0.5, "comment": "2-4 sentences on what the answer got right and wrong, measured against the reference", "missed": ["each point of the reference answer that is missing or misstated, short"], "issue": true if the answer identified the issue in the reference, "rule": true if it stated the reference's legal basis accurately, "application": true if it applied that basis to the facts adequately, "conclusion": true if its conclusion matches the reference}`;
  const r = await grader.json(prompt, { modelTier: "default" });
  const sc = Math.max(0, Math.min(q.pts, Math.round((+r.score || 0) * 2) / 2));
  const c = scrub(String(r.comment || ""), ref, true), m = (Array.isArray(r.missed) ? r.missed.map(String) : []).map(x => scrub(x, ref));
  const missed = m.filter(x => x.ok).map(x => x.text);
  const irac = { issue: r.issue === true, rule: r.rule === true, application: r.application === true, conclusion: r.conclusion === true };
  return { score: sc, by: "claude", comment: c.text, missed, scrubbed: c.dropped + m.length - missed.length, irac };
}

// Drops any sentence that cites a provision, statute, G.R. number or case absent from the reference answer.
function scrub(text, ref, bySentence) {
  const R = ref.toLowerCase();
  const nums = new Set(R.match(/\d+[a-z]?/g) || []);
  const known = t => {
    for (const m of t.matchAll(/\b(?:art(?:icle)?s?|sec(?:tion)?s?|rule|r\.?\s?a|p\.?\s?d|b\.?\s?p(?:\.?\s?blg)?|g\.?\s?r)\.?\s*(?:nos?\.?\s*)?(?:l-)?(\d+[a-z]?)/gi))
      if (!nums.has(m[1].toLowerCase())) return false;
    for (const m of t.matchAll(/\b([A-Z][A-Za-z'’-]{2,})\s+v(?:s)?\.\s+[A-Z]/g))
      if (!R.includes(m[1].toLowerCase())) return false;
    return true;
  };
  if (!bySentence) return { text, ok: known(text) };
  // Split into sentences without breaking on legal abbreviations such as "Art." or "v."
  const ABBR = /\b(?:arts?|secs?|nos?|v|vs|jr|sr|co|inc|corp|sps|phil|blg|par|r\.a|g\.r|p\.d|b\.p|n\.c\.c|j|cf|e\.g|i\.e)$/i;
  const parts = []; let start = 0;
  for (const m of text.matchAll(/[.!?](?=\s+[A-Z(])/g)) {
    const before = text.slice(start, m.index);
    if (m[0] === "." && ABBR.test(before.split(/\s+/).pop())) continue;
    parts.push(text.slice(start, m.index + 1).trim()); start = m.index + 1;
  }
  if (text.slice(start).trim()) parts.push(text.slice(start).trim());
  const kept = parts.filter(known);
  return { text: kept.join(" "), dropped: parts.length - kept.length };
}

async function gradeOne(i, el, batch) {
  const R = S.report, q = (R.qs || BANK[R.subject])[i], a = R.answers[i];
  const btn = el.querySelector("button"), note = el.querySelector("span");
  btn.disabled = true; note.textContent = "Claude is reading your answer…";
  if (!a.trim()) { R.grades[i] = { score: 0, by: "claude", comment: "No answer was written.", missed: [] }; postScore(); save(); if (!batch) render(); logToNotion(R.subject, q, a, R.grades[i], R.mode); return true; }
  try {
    R.grades[i] = await gradeAnswer(q, a, subj(R.subject).name);
    postScore(); save(); if (!batch) render(); logToNotion(R.subject, q, a, R.grades[i], R.mode); return true;
  } catch (e) {
    const msg = e?.code in ERR ? ERR[e.code] : "Grading failed. Try again, or score it yourself.";
    if (msg == null) { el.innerHTML = ""; $("#bulk") && ($("#bulk").innerHTML = ""); return false; }
    btn.disabled = false; note.textContent = e?.code === "cancelled" ? "" : msg; return false;
  }
}

render();
</script>
