<title>Overruled!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: the Bar Simulator's desk, turned into a recess room; a docket of games → one puzzle at a time */
:root {
  --bg: #eef1f5; --surface: #ffffff; --ink: #17202d; --muted: #5a6577; --rule: #d6dce5;
  --accent: #7b1e2b; --accent-ink: #ffffff; --gold: #9c7a22; --line: #e3e8ef;
  --good: #1f7a4d; --warn: #a3620a; --bad: #b42323; --soft: #f5f7fa; --hi: #f6ecd2; --hi2: #fbf6e8;
  --f-display: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e131b; --surface: #161d28; --ink: #e5e9f0; --muted: #98a3b5; --rule: #2a3444;
  --accent: #d86474; --accent-ink: #1a0f12; --gold: #d4b25a; --line: #222b39;
  --good: #4cc08a; --warn: #e3a344; --bad: #f07272; --soft: #1b2331; --hi: #3a3220; --hi2: #262419; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e131b; --surface: #161d28; --ink: #e5e9f0; --muted: #98a3b5; --rule: #2a3444;
  --accent: #d86474; --accent-ink: #1a0f12; --gold: #d4b25a; --line: #222b39;
  --good: #4cc08a; --warn: #e3a344; --bad: #f07272; --soft: #1b2331; --hi: #3a3220; --hi2: #262419; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px }
.wrap { max-width: 960px; margin: 0 auto }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; line-height: 1.25 }
h1 { font-size: clamp(1.7rem, 4vw, 2.3rem) }
h2 { font-size: 1.35rem }
h3 { font-size: 1.05rem }
p { margin: 0 }
.label { font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.muted { color: var(--muted) }
.small { font-size: .85rem }
button, select, input { font: inherit }
button { cursor: pointer; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); padding: 8px 14px; font-weight: 600 }
button:hover { border-color: var(--muted) }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
button.primary:hover { filter: brightness(1.08) }
button:disabled { opacity: .5; cursor: not-allowed }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 18px; min-width: 0 }
.pill { display: inline-block; font-size: .75rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; border: 1px solid currentColor; font-variant-numeric: tabular-nums }
.pill.good { color: var(--good) } .pill.bad { color: var(--bad) } .pill.idle { color: var(--muted) } .pill.warn { color: var(--warn) } .pill.acc { color: var(--accent) }

/* Masthead */
.mast { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px; padding-block: 28px 20px; border-bottom: 3px double var(--rule); margin-bottom: 22px }
.mast .seal { font-family: var(--f-display); font-style: italic; color: var(--gold) }

/* Controls: segmented pickers */
.controls { display: flex; flex-wrap: wrap; gap: 18px 28px; margin-bottom: 22px }
.ctl { display: flex; flex-direction: column; gap: 6px }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; background: var(--surface) }
.seg button { border: 0; border-radius: 0; padding: 7px 14px; background: transparent; font-weight: 600; color: var(--muted) }
.seg button + button { border-left: 1px solid var(--rule) }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }
.seg button[aria-pressed="true"] .rank { color: inherit }
.rank { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .05em; color: var(--gold); margin-right: 6px }

/* Docket of games */
.docket { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px }
.game { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.game .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.game .no { font-family: var(--f-mono); color: var(--gold); font-size: .78rem; font-weight: 700 }
.rules { margin: 0; padding: 10px 12px; list-style: none; background: var(--soft); border-radius: 6px; font-size: .85rem; display: grid; gap: 2px }
.rules li::before { content: "§ "; color: var(--gold); font-family: var(--f-display) }
.game .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; flex-wrap: wrap }

/* Game view */
.bench { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--rule); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px }
/* On phones the header wraps to several rows, so it scrolls away instead of covering the board */
@media (max-width: 600px) { .bench { position: static } }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.timer { font-family: var(--f-mono); font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums }
.timer.low { color: var(--bad) }
.status { min-height: 1.6em; font-weight: 600 }
.status.good { color: var(--good) } .status.bad { color: var(--bad) } .status.warn { color: var(--warn) }
.verdict { border: 1px solid var(--good); border-radius: 8px; padding: 14px 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface) }
.verdict h3 { color: var(--good) }

/* Crossword */
.cw { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 20px; align-items: start }
@media (max-width: 760px) { .cw { grid-template-columns: minmax(0, 1fr) } }
.board { display: grid; gap: 2px; background: var(--ink); border: 2px solid var(--ink); border-radius: 4px; padding: 0; width: max-content; max-width: 100% }
.cell { position: relative; aspect-ratio: 1; background: var(--ink) }
.cell.on { background: var(--surface) }
.cell.on.word { background: var(--hi2) }
.cell.on.cur { background: var(--hi) }
.cell input { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; color: var(--ink); text-align: center; text-transform: uppercase;
  font: 700 clamp(13px, 3.4vw, 19px)/1 var(--f-mono); padding: 10% 0 0; caret-color: transparent; border-radius: 0 }
.cell input:focus { outline: none }
.cell .n { position: absolute; top: 1px; left: 2px; font: 600 clamp(7px, 1.6vw, 10px)/1 var(--f-body); color: var(--muted); pointer-events: none; z-index: 1 }
.cell.bad input, .sq.bad input { color: var(--bad) }
.cell.rev input { color: var(--gold) }
.clues { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; min-width: 0 }
.clues ol { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px }
.clues li { padding: 4px 8px; border-radius: 5px; cursor: pointer; font-size: .9rem; display: grid; grid-template-columns: 2.2em 1fr; gap: 4px }
.clues li b { font-family: var(--f-mono); color: var(--accent) }
.clues li.cur { background: var(--hi) }
.clues li.done { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--rule) }
.cluebar { font-family: var(--f-display); font-size: 1.02rem; padding: 10px 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; margin-bottom: 10px; min-height: 2.6em }

/* Scramble */
.tiles { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-block: 14px }
.tile { width: 2.4rem; height: 2.6rem; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--rule); border-bottom-width: 3px; border-radius: 6px; font: 700 1.2rem var(--f-mono); color: var(--ink) }
.answer { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center }
.answer input { flex: 1 1 200px; max-width: 360px; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); font: 700 1.05rem var(--f-mono); text-transform: uppercase; letter-spacing: .12em }
.clue { text-align: center; font-family: var(--f-display); font-size: 1.05rem; max-width: 56ch; margin-inline: auto; min-height: 1.7em }
.shake { animation: shake .3s }
@keyframes shake { 25% { transform: translateX(-5px) } 75% { transform: translateX(5px) } }
table.tally { width: 100%; border-collapse: collapse; font-size: .9rem }
.tally td, .tally th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top }
.tally td:first-child { font-family: var(--f-mono); font-weight: 700; white-space: nowrap }
.tablewrap { overflow-x: auto }

/* Memory */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.6rem, 1fr)); gap: 8px }
.card { aspect-ratio: 3 / 4; border-radius: 8px; border: 1px solid var(--rule); background: var(--accent); color: var(--accent-ink); padding: 6px; display: grid; place-items: center; text-align: center; font-weight: 600; min-width: 0; transition: transform .15s }
.card .back { font-family: var(--f-display); font-style: italic; font-size: 1.4rem; opacity: .7 }
.card.up, .card.got { background: var(--surface); color: var(--ink) }
.card.got { border-color: var(--good); opacity: .65 }
.card .face { font-size: .82rem; line-height: 1.25; overflow-wrap: anywhere }
.card .face.big { font-size: 2rem }
.card .face.cite { font-family: var(--f-mono); color: var(--accent); font-size: .78rem }
.card:active { transform: scale(.97) }

/* Sudoku */
.sudoku { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); width: min(100%, 460px); border: 2px solid var(--ink); border-radius: 4px; overflow: hidden; background: var(--surface) }
.sq { position: relative; aspect-ratio: 1; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule) }
.sq:nth-child(9n) { border-right: 0 }
.sq:nth-child(3n):not(:nth-child(9n)) { border-right: 2px solid var(--ink) }
.sq:nth-child(n+19):nth-child(-n+27), .sq:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--ink) }
.sq:nth-child(n+73) { border-bottom: 0 }
.sq input { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; text-align: center; font: 600 clamp(15px, 4.4vw, 22px)/1 var(--f-mono); color: var(--accent); caret-color: transparent; border-radius: 0 }
.sq input:focus { outline: none }
.sq.given input { color: var(--ink); font-weight: 700 }
.sq.peer { background: var(--hi2) }
.sq.cur { background: var(--hi) }
.sq.same input { text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: 3px }
.pad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; width: min(100%, 460px); margin-top: 12px }
.pad button { font: 700 1.1rem var(--f-mono); padding: 9px 0 }

/* Content desk */
select { background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 10px; max-width: 100% }
select:disabled { opacity: .5 }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.bankline { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: .88rem; color: var(--muted); margin-bottom: 18px; padding: 10px 12px; border: 1px dashed var(--rule); border-radius: 8px }
.bankline b { color: var(--ink); font-variant-numeric: tabular-nums }
.check { display: flex; align-items: center; gap: 6px }
button.quiet { border: 0; background: transparent; color: var(--muted); padding: 4px 0; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; font-size: .85rem }
button.quiet:hover { color: var(--ink) }
.slot { margin-top: 8px; min-height: 1.6em }
.report { display: flex; flex-wrap: wrap; gap: 8px; justify-content: inherit }
.report input { flex: 1 1 200px; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink) }
.desk { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px }
.terms { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-block: 10px 22px }
.term { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.term .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.term ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px }
.term .row { margin-top: auto }
.mono { font-family: var(--f-mono) }
.mono-q { margin: 0; padding-left: 10px; border-left: 2px solid var(--gold); font-family: var(--f-display); white-space: pre-line }
.packhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px }

/* Word Search */
.ws { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 20px; align-items: start }
@media (max-width: 760px) { .ws { grid-template-columns: minmax(0, 1fr) } }
.wsgrid { display: grid; width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 4px; touch-action: none; user-select: none; -webkit-user-select: none }
.wc { aspect-ratio: 1; display: grid; place-items: center; font: 700 clamp(12px, 3.6vw, 18px)/1 var(--f-mono); color: var(--ink); border-radius: 4px; cursor: pointer }
.wc.found { background: var(--hi); color: var(--accent) }
.wc.sel { background: var(--accent); color: var(--accent-ink) }
.wslist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: .92rem }
.wslist li { padding: 4px 8px; border-radius: 5px; background: var(--soft) }
.wslist li.done { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--rule) }
.wslist li.done b { color: var(--good) }

/* Objection! */
.court { display: flex; flex-direction: column; gap: 12px }
.fuse { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden }
.fuse i { display: block; height: 100%; width: 100%; background: var(--gold); border-radius: 99px }
.facts { font-family: var(--f-display); font-size: 1.12rem; line-height: 1.65; max-width: 62ch }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px }
.choices button { text-align: left; padding: 12px 14px; font-size: 1rem }
.choices button.right { border-color: var(--good); color: var(--good); opacity: 1 }
.choices button.wrong { border-color: var(--bad); color: var(--bad); opacity: 1; text-decoration: line-through }
.ruling { border-radius: 6px; padding: 12px 14px; border: 1px solid currentColor; display: grid; gap: 4px }
.ruling h3 { font-size: 1.4rem }
.ruling.good { color: var(--good) } .ruling.bad { color: var(--bad) }
.ruling p { color: var(--ink) }
#ob-ruling { display: grid; gap: 10px }
#ob-ruling:empty { display: none }

/* Legal basis cards */
.basis-list { display: grid; gap: 10px; margin-top: 14px }
.basis-list:empty { display: none }
.basis { background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--gold); border-radius: 6px; padding: 12px 14px; display: grid; gap: 6px; min-width: 0; text-align: left }
.basis blockquote { margin: 0; font-family: var(--f-display); font-size: .95rem; line-height: 1.65; white-space: pre-line; overflow-wrap: anywhere; max-width: 72ch }
.basis a { color: var(--accent) }

@media (prefers-reduced-motion: reduce) { .shake { animation: none } .card { transition: none } }
</style>

  mercantile: "Mercantile Law", criminal: "Criminal Law", remedial: "Remedial Law", ethics: "Legal Ethics" };

const titleCase = a => a[0] + a.slice(1).toLowerCase();
function parseTerms(s, block) {
  return block.trim().split("\n").map(line => {
    const [a, k, d, ...c] = line.split("|").map(x => x.trim());
    return { a, s, k: k || "", d: d || titleCase(a), c: c.filter(Boolean), src: "bank" };
  });
}

const BASIS = {"Art. II, Sec. 1":{"t":"Section 1. The Philippines is a democratic and republican State. Sovereignty resides in the people and all government authority emanates from them.","src":"1987 Constitution","u":"https://lawphil.net/consti/cons1987.html"},"Art. III, Sec. 1":{"t":"Section 1. No person shall be deprived of life, liberty, or property without due process of law, nor shall any person be denied the equal protection of the laws.","src":"1987 Constitution","u":"https://lawphil.net/consti/cons1987.html"},"Art. III, Sec. 9":{"t":"Section 9. Private property shall not be taken for public use without just compensation.","src":"1987 Constitution","u":"https://lawphil.net/consti/cons1987.html"},"Art. III, Sec. 12":{"t":"Section 12. (1) Any person under investigation for the commission of an offense shall have the right to be informed of his right to remain silent and to have competent and independent counsel preferably of his own choice. If the person cannot afford the services of counsel, he must be provided with one. These rights cannot be waived except in writing and in the presence of counsel.","src":"1987 Constitution","u":"https://lawphil.net/consti/cons1987.html"},"Art. III, Sec. 20":{"t":"Section 20. No person shall be imprisoned for debt or non-payment of a poll tax.","src":"1987 Constitution","u":"https://lawphil.net/consti/cons1987.html"},"Art. VI, Sec. 26":{"t":"Section 26. (1) Every bill passed by the Congress shall embrace only one subject which shall be expressed in the title thereof.","src":"1987 Constitution","u":"https://lawphil.net/consti/cons1987.html"},"Art. VI, Sec. 28":{"t":"Section 28. (1) The rule of taxation shall be uniform and equitable. The Congress shall evolve a progressive system of taxation.","src":"1987 Constitution","u":"https://lawphil.net/consti/cons1987.html"},"Art. VII, Sec. 18":{"t":"… In case of invasion or rebellion, when the public safety requires it, he may, for a period not exceeding sixty days, suspend the privilege of the writ of habeas corpus or place the Philippines or any part thereof under martial law.","src":"1987 Constitution","u":"https://lawphil.net/consti/cons1987.html"},"Art. VII, Sec. 19":{"t":"Section 19. Except in cases of impeachment, or as otherwise provided in this Constitution, the President may grant reprieves, commutations, and pardons, and remit fines and forfeitures, after conviction by final judgment.","src":"1987 Constitution","u":"https://lawphil.net/consti/cons1987.html"},"Art. VII, Sec. 21":{"t":"Section 21. No treaty or international agreement shall be valid and effective unless concurred in by at least two-thirds of all the Members of the Senate.","src":"1987 Constitution","u":"https://lawphil.net/consti/cons1987.html"},"Art. IX-C":{"t":"Section 2. The Commission on Elections shall exercise the following powers and functions:\nEnforce and administer all laws and regulations relative to the conduct of an election, plebiscite, initiative, referendum, and recall.","src":"1987 Constitution","u":"https://lawphil.net/consti/cons1987.html","note":"Sec. 2(1)"},"Art. IX-D":{"t":"Section 2. (1) The Commission on Audit shall have the power, authority, and duty to examine, audit, and settle all accounts pertaining to the revenue and receipts of, and expenditures or uses of funds and property, owned or held in trust by, or pertaining to, the Government, or any of its subdivisions, agencies, or instrumentalities, including government-owned or controlled corporations with original charters, and on a post- audit basis: …","src":"1987 Constitution","u":"https://lawphil.net/consti/cons1987.html","note":"Sec. 2(1)"},"Art. X":{"t":"Section 2. The territorial and political subdivisions shall enjoy local autonomy.","src":"1987 Constitution","u":"https://lawphil.net/consti/cons1987.html","note":"Sec. 2"},"Art. XI, Sec. 3":{"t":"… The House of Representatives shall have the exclusive power to initiate all cases of impeachment.\nNo impeachment proceedings shall be initiated against the same official more than once within a period of one year.\nThe Senate shall have the sole power to try and decide all cases of impeachment. When sitting for that purpose, the Senators shall be on oath or affirmation. When the President of the Philippines is on trial, the Chief Justice of the Supreme Court shall preside, but shall not vote. No person shall be convicted without the concurrence of two-thirds of all the Members of the Senate.","src":"1987 Constitution","u":"https://lawphil.net/consti/cons1987.html"},"Art. XI, Sec. 4":{"t":"Section 4. The present anti-graft court known as the Sandiganbayan shall continue to function and exercise its jurisdiction as now or hereafter may be provided by law.","src":"1987 Constitution","u":"https://lawphil.net/consti/cons1987.html"},"Art. XI, Sec. 12":{"t":"Section 12. The Ombudsman and his Deputies, as protectors of the people, shall act promptly on complaints filed in any form or manner against public officials or employees of the Government, or any subdivision, agency or instrumentality thereof, including government-owned or controlled corporations, and shall, in appropriate cases, notify the complainants of the action taken and the result thereof.","src":"1987 Constitution","u":"https://lawphil.net/consti/cons1987.html"},"Art. XII, Sec. 2":{"t":"… All lands of the public domain, waters, minerals, coal, petroleum, and other mineral oils, all forces of potential energy, fisheries, forests or timber, wildlife, flora and fauna, and other natural resources are owned by the State.","src":"1987 Constitution","u":"https://lawphil.net/consti/cons1987.html"},"Art. XII, Sec. 11":{"t":"… No franchise, certificate, or any other form of authorization for the operation of a public utility shall be granted except to citizens of the Philippines or to corporations or associations organized under the laws of the Philippines, at least sixty per centum of whose capital is owned by such citizens; nor shall such franchise, certificate, or authorization be exclusive in character or for a longer period than fifty years.","src":"1987 Constitution","u":"https://lawphil.net/consti/cons1987.html"},"Art. 50, NCC":{"t":"Article 50. For the exercise of civil rights and the fulfillment of civil obligations, the domicile of natural persons is the place of their habitual residence. (40a)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 440, NCC":{"t":"Article 440. The ownership of property gives the right by accession to everything which is produced thereby, or which is incorporated or attached thereto, either naturally or artificially. (353)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 457, NCC":{"t":"Article 457. To the owners of lands adjoining the banks of rivers belong the accretion which they gradually receive from the effects of the current of the waters. (336)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 523, NCC":{"t":"Article 523. Possession is the holding of a thing or the enjoyment of a right. (430a)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 562, NCC":{"t":"Article 562. Usufruct gives a right to enjoy the property of another with the obligation of preserving its form and substance, unless the title constituting it or the law otherwise provides. (467)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 613, NCC":{"t":"Article 613. An easement or servitude is an encumbrance imposed upon an immovable for the benefit of another immovable belonging to a different owner.\nThe immovable in favor of which the easement is established is called the dominant estate; that which is subject thereto, the servient estate. (530)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 694, NCC":{"t":"Article 694. A nuisance is any act, omission, establishment, business, condition of property, or anything else which:\n(1) Injures or endangers the health or safety of others; or\n(2) Annoys or offends the senses; or\n(3) Shocks, defies or disregards decency or morality; or\n(4) Obstructs or interferes with the free passage of any public highway or street, or any body of water; or\n(5) Hinders or impairs the use of property.","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 725, NCC":{"t":"Article 725. Donation is an act of liberality whereby a person disposes gratuitously of a thing or right in favor of another, who accepts it. (618a)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 810, NCC":{"t":"Article 810. A person may execute a holographic will which must be entirely written, dated, and signed by the hand of the testator himself. It is subject to no other form, and may be made in or out of the Philippines, and need not be witnessed. (678, 688a)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 825, NCC":{"t":"Article 825. A codicil is supplement or addition to a will, made after the execution of a will and annexed to be taken as a part thereof, by which disposition made in the original will is explained, added to, or altered. (n)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 854, NCC":{"t":"Article 854. The preterition or omission of one, some, or all of the compulsory heirs in the direct line, whether living at the time of the execution of the will or born after the death of the testator, shall annul the institution of heir; but the devises and legacies shall be valid insofar as they are not inofficious.\nIf the omitted compulsory heirs should die before the testator, the institution shall be effectual, without prejudice to the right of representation. (814a)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 886, NCC":{"t":"Article 886. Legitime is that part of the testator's property which he cannot dispose of because the law has reserved it for certain heirs who are, therefore, called compulsory heirs. (806)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 970, NCC":{"t":"Article 970. Representation is a right created by fiction of law, by virtue of which the representative is raised to the place and the degree of the person represented, and acquires the rights which the latter would have if he were living or if he could have inherited. (942a)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1015, NCC":{"t":"Article 1015. Accretion is a right by virtue of which, when two or more persons are called to the same inheritance, devise or legacy, the part assigned to the one who renounces or cannot receive his share, or who died before the testator, is added or incorporated to that of his co-heirs, co-devisees, or co-legatees. (n)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1106, NCC":{"t":"Article 1106. By prescription, one acquires ownership and other real rights through the lapse of time in the manner and under the conditions laid down by law.\nIn the same way, rights and conditions are lost by prescription. (1930a)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1174, NCC":{"t":"Article 1174. Except in cases expressly specified by the law, or when it is otherwise declared by stipulation, or when the nature of the obligation requires the assumption of risk, no person shall be responsible for those events which could not be foreseen, or which, though foreseen, were inevitable. (1105a)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1207, NCC":{"t":"Article 1207. The concurrence of two or more creditors or of two or more debtors in one and the same obligation does not imply that each one of the former has a right to demand, or that each one of the latter is bound to render, entire compliance with the prestation. There is a solidary liability only when the obligation expressly so states, or when the law or the nature of the obligation requires solidarity. (1137a)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1245, NCC":{"t":"Article 1245. Dation in payment, whereby property is alienated to the creditor in satisfaction of a debt in money, shall be governed by the law of sales. (n)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1270, NCC":{"t":"Article 1270. Condonation or remission is essentially gratuitous, and requires the acceptance by the obligor. It may be made expressly or impliedly.\nOne and the other kind shall be subject to the rules which govern inofficious donations. Express condonation shall, furthermore, comply with the forms of donation. (1187)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1278, NCC":{"t":"Article 1278. Compensation shall take place when two persons, in their own right, are creditors and debtors of each other. (1195)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1291, NCC":{"t":"Article 1291. Obligations may be modified by:\n(1) Changing their object or principal conditions;\n(2) Substituting the person of the debtor;\n(3) Subrogating a third person in the rights of the creditor. (1203)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1359, NCC":{"t":"Article 1359. When, there having been a meeting of the minds of the parties to a contract, their true intention is not expressed in the instrument purporting to embody the agreement, by reason of mistake, fraud, inequitable conduct or accident, one of the parties may ask for the reformation of the instrument to the end that such true intention may be expressed.\nIf mistake, fraud, inequitable conduct, or accident has prevented a meeting of the minds of the parties, the proper remedy is not reformation of the instrument but annulment of the contract.","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1381, NCC":{"t":"Article 1381. The following contracts are rescissible:\n(1) Those which are entered into by guardians whenever the wards whom they represent suffer lesion by more than one-fourth of the value of the things which are the object thereof;\n(2) Those agreed upon in representation of absentees, if the latter suffer the lesion stated in the preceding number;\n(3) Those undertaken in fraud of creditors when the latter cannot in any other manner collect the claims due them;\n(4) Those which refer to things under litigation if they have been entered into by the defendant without the knowledge and approval of the litigants or of competent judicial authority;\n(5) All other contracts specially declared by law to be subject to rescission. (1291a)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1390, NCC":{"t":"Article 1390. The following contracts are voidable or annullable, even though there may have been no damage to the contracting parties:\n(1) Those where one of the parties is incapable of giving consent to a contract;\n(2) Those where the consent is vitiated by mistake, violence, intimidation, undue influence or fraud.\nThese contracts are binding, unless they are annulled by a proper action in court. They are susceptible of ratification. (n)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1431, NCC":{"t":"Article 1431. Through estoppel an admission or representation is rendered conclusive upon the person making it, and cannot be denied or disproved as against the person relying thereon.","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1732, NCC":{"t":"Article 1732. Common carriers are persons, corporations, firms or associations engaged in the business of carrying or transporting passengers or goods or both, by land, water, or air, for compensation, offering their services to the public.","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1733, NCC":{"t":"Article 1733. Common carriers, from the nature of their business and for reasons of public policy, are bound to observe extraordinary diligence in the vigilance over the goods and for the safety of the passengers transported by them, according to all the circumstances of each case.\nSuch extraordinary diligence in the vigilance over the goods is further expressed in articles 1734, 1735, and 1745, Nos. 5, 6, and 7, while the extraordinary diligence for the safety of the passengers is further set forth in articles 1755 and 1756.","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1767, NCC":{"t":"Article 1767. By the contract of partnership two or more persons bind themselves to contribute money, property, or industry to a common fund, with the intention of dividing the profits among themselves.\nTwo or more persons may also form a partnership for the exercise of a profession. (1665a)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1868, NCC":{"t":"Article 1868. By the contract of agency a person binds himself to render some service or to do something in representation or on behalf of another, with the consent or authority of the latter. (1709a)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1933, NCC":{"t":"Article 1933. By the contract of loan, one of the parties delivers to another, either something not consumable so that the latter may use the same for a certain time and return it, in which case the contract is called a commodatum; or money or other consumable thing, upon the condition that the same amount of the same kind and quality shall be paid, in which case the contract is simply called a loan or mutuum.\nCommodatum is essentially gratuitous.\nSimple loan may be gratuitous or with a stipulation to pay interest.\nIn commodatum the bailor retains the ownership of the thing loaned, while in simple loan, ownership passes to the borrower. (1740a)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1953, NCC":{"t":"Article 1953. A person who receives a loan of money or any other fungible thing acquires the ownership thereof, and is bound to pay to the creditor an equal amount of the same kind and quality. (1753a)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 1962, NCC":{"t":"Article 1962. A deposit is constituted from the moment a person receives a thing belonging to another, with the obligation of safely keeping it and of returning the same. If the safekeeping of the thing delivered is not the principal purpose of the contract, there is no deposit but some other contract. (1758a)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 2047, NCC":{"t":"Article 2047. By guaranty a person, called the guarantor, binds himself to the creditor to fulfill the obligation of the principal debtor in case the latter should fail to do so.\nIf a person binds himself solidarily with the principal debtor, the provisions of Section 4, Chapter 3, Title I of this Book shall be observed. In such case the contract is called a suretyship. (1822a)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 2058, NCC":{"t":"Article 2058. The guarantor cannot be compelled to pay the creditor unless the latter has exhausted all the property of the debtor, and has resorted to all the legal remedies against the debtor. (1830a)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 2132, NCC":{"t":"Article 2132. By the contract of antichresis the creditor acquires the right to receive the fruits of an immovable of his debtor, with the obligation to apply them to the payment of the interest, if owing, and thereafter to the principal of his credit. (1881)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 2176, NCC":{"t":"Article 2176. Whoever by act or omission causes damage to another, there being fault or negligence, is obliged to pay for the damage done. Such fault or negligence, if there is no pre-existing contractual relation between the parties, is called a quasi-delict and is governed by the provisions of this Chapter. (1902a)","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"Art. 2207, NCC":{"t":"Article 2207. If the plaintiff's property has been insured, and he has received indemnity from the insurance company for the injury or loss arising out of the wrong or breach of contract complained of, the insurance company shall be subrogated to the rights of the insured against the wrongdoer or the person who has violated the contract. If the amount paid by the insurance company does not fully cover the injury or loss, the aggrieved party shall be entitled to recover the deficiency from the person causing the loss or injury.","src":"Civil Code (RA 386)","u":"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html"},"FC, Art. 36":{"t":"Article 36. A marriage contracted by any party who, at the time of the celebration, was psychologically incapacitated to comply with the essential marital obligations of marriage, shall likewise be void even if such incapacity becomes manifest only after its solemnization. (As amended by Executive Order 227)","src":"Family Code (EO 209)","u":"https://lawphil.net/executive/execord/eo1987/eo_209_1987.html"},"FC, Art. 172":{"t":"Article 172. The filiation of legitimate children is established by any of the following:\n(1) The record of birth appearing in the civil register or a final judgment; or\n(2) An admission of legitimate filiation in a public document or a private handwritten instrument and signed by the parent concerned.\nIn the absence of the foregoing evidence, the legitimate filiation shall be proved by:\n(1) The open and continuous possession of the status of a legitimate child; or\n(2) Any other means allowed by the Rules of Court and special laws. (265a, 266a, 267a)","src":"Family Code (EO 209)","u":"https://lawphil.net/executive/execord/eo1987/eo_209_1987.html"},"FC, Art. 177":{"t":"Art. 177. Children conceived and born outside of wedlock of parents who, at the time of conception of the former, were not disqualified by any impediment to marry each other, or were so disqualified only because either or both of them were below eighteen (18) years of age, may be legitimated.","src":"RA 9858, amending FC Art. 177","u":"https://lawphil.net/statutes/repacts/ra2009/ra_9858_2009.html","note":"As amended by RA 9858"},"Art. 3, RPC":{"t":"Article 3. Definition.-Acts and omissions punishable by law are felonies (delitos).\nFelonies are committed not only by means of deceit (dolo) but also by means of fault (culpa).\nThere is deceit when the act is performed with deliberate intent; and there is fault when the wrongful act results from imprudence, negligence, lack of foresight, or lack of skill.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 8, RPC":{"t":"Article 8. Conspiracy and proposal to commit felony.-Conspiracy and proposal to commit felony are punishable only in the cases in which the law specially provides a penalty therefor.\nA conspiracy exists when two or more persons come to an agreement concerning the commission of a felony and decide to commit it.\nThere is proposal when the person who has decided to commit a felony proposes its execution to some other person or persons.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 11(1), RPC":{"t":"Article 11. Justifying circumstances.-The following do not incur any criminal liability:\n1. Anyone who acts in defense of his person or rights, provided that the following circumstances concur:\nFirst. Unlawful aggression;\nSecond. Reasonable necessity of the means employed to prevent or repel it;\nThird. Lack of sufficient provocation on the part of the person defending himself.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 12(1), RPC":{"t":"Article 12. Circumstances which exempt from criminal liability.-The following are exempt from criminal liability:\n1. An imbecile or an insane person, unless the latter has acted during a lucid interval.\nWhen the imbecile or an insane person has committed an act which the law defines as a felony (delito), the court shall order his confinement in one of the hospitals or asylums established for persons thus afflicted, which he shall not be permitted to leave without first obtaining the permission of the same court.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 13(6), RPC":{"t":"Article 13. Mitigating circumstances.-The following are mitigating circumstances:\n6. That of having acted upon an impulse so powerful as naturally to have produced passion or obfuscation.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 13(7), RPC":{"t":"Article 13. Mitigating circumstances.-The following are mitigating circumstances:\n7. That the offender had voluntarily surrendered himself to a person in authority or his agents, or that he had voluntarily confessed his guilt before the court prior to the presentation of the evidence for the prosecution.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 14(6), RPC":{"t":"Article 14. Aggravating circumstances.-The following are aggravating circumstances:\n6. That the crime be committed in the night time, or in an uninhabited place, or by a band, whenever such circumstances may facilitate the commission of the offense.\nWhenever more than three armed malefactors shall have acted together in the commission of an offense it shall be deemed to have been committed by a band.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 14(9), RPC":{"t":"Article 14. Aggravating circumstances.-The following are aggravating circumstances:\n9. That the accused is a recidivist.\nA recidivist is one who, at the time of his trial for one crime, shall have been previously convicted by final judgment of another crime embraced in the same title of this Code.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 14(10), RPC":{"t":"Article 14. Aggravating circumstances.-The following are aggravating circumstances:\n10. That the offender has been previously punished for an offense to which the law attaches an equal or greater penalty or for two or more crimes to which it attaches a lighter penalty.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 14(16), RPC":{"t":"Article 14. Aggravating circumstances.-The following are aggravating circumstances:\n16. That the act be committed with treachery (alevosia).\nThere is treachery when the offender commits any of the crimes against the person, employing means, methods, or forms in the execution thereof which tend directly and specially to insure its execution, without risk to himself arising from the defense which the offended party might make.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 14(17), RPC":{"t":"Article 14. Aggravating circumstances.-The following are aggravating circumstances:\n17. That means be employed or circumstances brought about which add ignominy to the natural effects of the act.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 27, RPC":{"t":"Art. 27. Reclusion perpetua. - The penalty of reclusion perpetua shall be from twenty years and one day to forty years.","src":"RA 7659, amending the RPC","u":"https://lawphil.net/statutes/repacts/ra1993/ra_7659_1993.html","note":"As amended by RA 7659"},"Art. 48, RPC":{"t":"Article 48. Penalty for complex crimes.-When a single act constitutes two or more crimes, or when an offense is a necessary means for committing the other, the penalty for the most serious crime shall be imposed, the same to be applied in its maximum period.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 62, RPC":{"t":"Art. 62. Effects of the attendance of mitigating or aggravating circumstances and of habitual delinquency. - Mitigating or aggravating circumstances and habitual delinquency shall be taken into account for the purpose of diminishing or increasing the penalty in conformity with the following rules:\nFor purposes of this article, a person shall be deemed to be a habitual delinquent, if within a period of ten years from the date of his release or last conviction of the crimes of serious or less serious physical injuries, robo, hurto, estafa or falsification, he is found guilty of any of said crimes a third time or oftener.","src":"RA 7659, amending the RPC","u":"https://lawphil.net/statutes/repacts/ra1993/ra_7659_1993.html","note":"As amended by RA 7659"},"Art. 134, RPC":{"t":"Article 134. Rebellion or insurrection-How committed.-The crime of rebellion or insurrection is committed by rising publicly and taking arms against the Government for the purpose of removing from the allegiance to said Government or its laws, the territory of the Philippine Islands or any part thereof of any body of land, naval or other armed forces, or of depriving the Chief Executive or the Legislature, wholly or partially, of any of their powers or prerogatives.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 139, RPC":{"t":"Article 139. Sedition-How committed.-The crime of sedition, is committed by persons who rise publicly and tumultuously in order to attain by force any of the following objects:\n1. To prevent the promulgation or execution of any law or the holding of any popular election;\n2. To prevent the Insular Government, or any provincial or municipal government or any public officer thereof from freely exercising its or his functions, or prevent the execution of any administrative order;\n3. To inflict any act of hate or revenge upon the person or property of any public officer or employee;\n4. To commit, for any political or social end, any act of hate or revenge against private persons or any social class; and\n5. To despoil, for any political or social end, any person, municipality or province, or the Insular Government or the Government of the United States, of all its property or any part thereof.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 210, RPC":{"t":"Article 210. Direct bribery.-Any public officer who shall agree to perform an act constituting a crime, in connection with the performance of his official duties, in consideration of any offer, promise, gift or present received by such officer, personally or through the mediation of another, shall suffer the penalty of prision correccional in its minimum and medium periods and a fine of not less than the value of the gift and not more than three times such value, in addition to the penalty corresponding to the crime agreed upon, if the same shall have been committed.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 217, RPC":{"t":"Art. 217. Malversation of public funds or property.— Presumption of malversation. - Any public officer who, by reason of the duties of his office, is accountable for public funds or property, shall appropriate the same, or shall take or misappropriate or shall consent, through abandonment or negligence, shall permit any other person to take such public funds or property, wholly or partially, or shall otherwise be guilty of the misappropriation or malversation of such funds or property, shall suffer: …","src":"RA 10951, amending the RPC","u":"https://lawphil.net/statutes/repacts/ra2017/ra_10951_2017.html","note":"As amended by RA 10951"},"Art. 246, RPC":{"t":"Art. 246. Parricide. - Any person who shall kill his father, mother, or child, whether legitimate of illegitimate, or any of his ascendants, or descendants, or his spouse, shall be guilty of parricide and shall be punished by the penalty of reclusion perpetua to death.","src":"RA 7659, amending the RPC","u":"https://lawphil.net/statutes/repacts/ra1993/ra_7659_1993.html","note":"As amended by RA 7659"},"Art. 248, RPC":{"t":"Art. 248. Murder. - Any person who, not falling within the provisions of Article 246 shall kill another, shall be guilty of murder and shall be punished by reclusion perpetua, to death if committed with any of the following attendant circumstances:\n1. With treachery, taking advantage of superior strength, with the aid of armed men, or employing means to weaken the defense or of means or persons to insure or afford impunity.\n2. In consideration of a price, reward or promise.\n3. By means of inundation, fire, poison, explosion, shipwreck, stranding of a vessel, derailment or assault upon a railroad, fall of an airship, or by means of motor vehicles, or with the use of any other means involving great waste and ruin.\n4. …","src":"RA 7659, amending the RPC","u":"https://lawphil.net/statutes/repacts/ra1993/ra_7659_1993.html","note":"As amended by RA 7659"},"Art. 249, RPC":{"t":"Article 249. Homicide.-Any person who, not falling within the provisions of article 246 shall kill another without the attendance of any of the circumstances enumerated in the next preceding article, shall be deemed guilty of homicide and be punished by reclusion temporal.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 255, RPC":{"t":"Art. 255. Infanticide. - The penalty provided for parricide in Article 246 and for murder in Article 248 shall be imposed upon any person who shall kill any child less than three days of age.","src":"RA 7659, amending the RPC","u":"https://lawphil.net/statutes/repacts/ra1993/ra_7659_1993.html","note":"As amended by RA 7659"},"Art. 293, RPC":{"t":"Article 293. Who are guilty of robbery.-Any person who, with intent to gain, shall take any personal property belonging to another, by means of violence against or intimidation of any person, or using force upon anything, shall be guilty of robbery.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 308, RPC":{"t":"Article 308. Who are liable for theft.-Theft is committed by any person who, with intent to gain but without violence against or intimidation of persons nor force upon things, shall take personal property of another without the latter's consent.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 315, RPC":{"t":"Art. 315. Swindling (estafa). - Any person who shall defraud another by any of the means mentioned hereinbelow shall be punished by: …","src":"RA 10951, amending the RPC","u":"https://lawphil.net/statutes/repacts/ra2017/ra_10951_2017.html","note":"As amended by RA 10951"},"Art. 349, RPC":{"t":"Article 349. Bigamy.-The penalty of prision mayor shall be imposed upon any person who shall contract a second or subsequent marriage before the former marriage has been legally dissolved, or before the absent spouse has been declared presumptively dead by means of a judgment rendered in the proper proceedings.","src":"Revised Penal Code (Act 3815)","u":"https://lawphil.net/statutes/acts/act1930/act_3815_1930.html"},"Art. 4, LC":{"t":"Article 4. Construction in favor of labor. All doubts in the implementation and interpretation of the provisions of this Code, including its implementing rules and regulations, shall be resolved in favor of labor.","src":"Labor Code (PD 442)","u":"https://lawphil.net/statutes/presdecs/pd1974/pd_442_1974.html"},"Art. 86, LC":{"t":"Article 86. Night shift differential. Every employee shall be paid a night shift differential of not less than ten percent (10%) of his regular wage for each hour of work performed between ten o’clock in the evening and six o’clock in the morning.","src":"Labor Code (PD 442)","u":"https://lawphil.net/statutes/presdecs/pd1974/pd_442_1974.html"},"Art. 87, LC":{"t":"Article 87. Overtime work. Work may be performed beyond eight (8) hours a day provided that the employee is paid for the overtime work, an additional compensation equivalent to his regular wage plus at least twenty-five percent (25%) thereof. Work performed beyond eight hours on a holiday or rest day shall be paid an additional compensation equivalent to the rate of the first eight hours on a holiday or rest day plus at least thirty percent (30%) thereof.","src":"Labor Code (PD 442)","u":"https://lawphil.net/statutes/presdecs/pd1974/pd_442_1974.html"},"Art. 95, LC":{"t":"Article 95. Right to service incentive leave.\nEvery employee who has rendered at least one year of service shall be entitled to a yearly service incentive leave of five days with pay.","src":"Labor Code (PD 442)","u":"https://lawphil.net/statutes/presdecs/pd1974/pd_442_1974.html"},"Art. 219, LC":{"t":"… \"Strike\" means any temporary stoppage of work by the concerted action of employees as a result of an industrial or labor dispute.","src":"Labor Code (PD 442)","u":"https://lawphil.net/statutes/presdecs/pd1974/pd_442_1974.html","note":"Formerly Art. 212(o)"},"Art. 224, LC":{"t":"Article 217. Jurisdiction of the Labor Arbiters and the Commission.\nExcept as otherwise provided under this Code, the Labor Arbiters shall have original and exclusive jurisdiction to hear and decide, within thirty (30) calendar days after the submission of the case by the parties for decision without extension, even in the absence of stenographic notes, the following cases involving all workers, whether agricultural or non-agricultural:\n…\n2. Termination disputes;","src":"Labor Code (PD 442)","u":"https://lawphil.net/statutes/presdecs/pd1974/pd_442_1974.html","note":"Formerly Art. 217"},"Art. 295, LC":{"t":"Article 280. Regular and casual employment. The provisions of written agreement to the contrary notwithstanding and regardless of the oral agreement of the parties, an employment shall be deemed to be regular where the employee has been engaged to perform activities which are usually necessary or desirable in the usual business or trade of the employer, except where the employment has been fixed for a specific project or undertaking the completion or termination of which has been determined at the time of the engagement of the employee or where the work or service to be performed is seasonal in nature and the employment is for the duration of the season.","src":"Labor Code (PD 442)","u":"https://lawphil.net/statutes/presdecs/pd1974/pd_442_1974.html","note":"Formerly Art. 280"},"Art. 296, LC":{"t":"Article 281. Probationary employment. Probationary employment shall not exceed six (6) months from the date the employee started working, unless it is covered by an apprenticeship agreement stipulating a longer period. The services of an employee who has been engaged on a probationary basis may be terminated for a just cause or when he fails to qualify as a regular employee in accordance with reasonable standards made known by the employer to the employee at the time of his engagement. An employee who is allowed to work after a probationary period shall be considered a regular employee.","src":"Labor Code (PD 442)","u":"https://lawphil.net/statutes/presdecs/pd1974/pd_442_1974.html","note":"Formerly Art. 281"},"Art. 297, LC":{"t":"Article 282. Termination by employer. An employer may terminate an employment for any of the following causes:\n(a) Serious misconduct or willful disobedience by the employee of the lawful orders of his employer or representative in connection with his work;\n(b) Gross and habitual neglect by the employee of his duties;\n(c) Fraud or willful breach by the employee of the trust reposed in him by his employer or duly authorized representative;\n(d) Commission of a crime or offense by the employee against the person of his employer or any immediate member of his family or his duly authorized representatives; and\n(e) Other causes analogous to the foregoing.","src":"Labor Code (PD 442)","u":"https://lawphil.net/statutes/presdecs/pd1974/pd_442_1974.html","note":"Formerly Art. 282"},"Art. 302, LC":{"t":"… In the absence of a retirement plan or agreement providing for retirement benefits of employees in the establishment, an employee upon reaching the age of sixty (60) years or more, but not beyond sixty-five (65) years which is hereby declared the compulsory retirement age, who has served at least five (5) years in the said establishment, may retire and shall be entitled to retirement pay equivalent to at least one-half (1/2) month salary for every year of service, a fraction of at least six (6) months being considered as one whole year.","src":"Labor Code (PD 442)","u":"https://lawphil.net/statutes/presdecs/pd1974/pd_442_1974.html","note":"Formerly Art. 287, as amended by RA 7641"},"Art. 306, LC":{"t":"Article 291. Money claims. All money claims arising from employer-employee relations accruing during the effectivity of this Code shall be filed within three (3) years from the time the cause of action accrued; otherwise they shall be forever barred.","src":"Labor Code (PD 442)","u":"https://lawphil.net/statutes/presdecs/pd1974/pd_442_1974.html","note":"Formerly Art. 291"},"Sec. 84, NIRC":{"t":"Sec. 84. Rate of Estate Tax. - There shall be levied, assessed, collected and paid upon the transfer of the net estate as determined in accordance with Sections 85 and 86 of every decedent, whether resident or nonresident of the Philippines, a tax at the rate of six percent (6%) based on the value of such net estate.","src":"NIRC as amended by TRAIN (RA 10963)","u":"https://lawphil.net/statutes/repacts/ra2017/ra_10963_2017.html","note":"As amended by TRAIN"},"Sec. 99, NIRC":{"t":"Sec. 99. Rate of Tax Payable by Donor -\n(A) In General. - The tax for each calendar year shall be six percent (6%) computed on the basis of the total gifts in excess of Two hundred fifty thousand pesos (₱250,000) exempt gift made during the calendar year.","src":"NIRC as amended by TRAIN (RA 10963)","u":"https://lawphil.net/statutes/repacts/ra2017/ra_10963_2017.html","note":"As amended by TRAIN"},"Sec. 33, NIRC":{"t":"Sec. 33. Special Treatment of Fringe Benefit. -\n(a) Imposition of Tax. - Effective January 1, 2018 and onwards, a final tax of thirty-five percent (35%) is hereby imposed on the grossed-up monetary value of fringe benefit furnished or granted to the employee (except rank and file employees as defined herein) by the employer, whether an individual or a corporation (unless the fringe benefit is required by the nature of, or necessary to the trade, business or profession of the employer, or when the fringe benefit is for the convenience or advantage of the employer). The tax herein imposed is payable by the employer which tax shall be paid in the same manner as provided for under Section 57(A) of this Code. …","src":"NIRC as amended by TRAIN (RA 10963)","u":"https://lawphil.net/statutes/repacts/ra2017/ra_10963_2017.html","note":"As amended by TRAIN"},"Sec. 203, NIRC":{"t":"Section 203. Period of Limitation Upon Assessment and Collection. - Except as provided in Section 222, internal revenue taxes shall be assessed within three (3) years after the last day prescribed by law for the filing of the return, and no proceeding in court without assessment for the collection of such taxes shall be begun after the expiration of such period: Provided, That in a case where a return is filed beyond the period prescribed by law, the three (3)-year period shall be counted from the day the return was filed. For purposes of this Section, a return filed before the last day prescribed by law for the filing thereof shall be considered as filed on such last day.","src":"NIRC (RA 8424)","u":"https://lawphil.net/statutes/repacts/ra1997/ra_8424_1997.html"},"Sec. 204, NIRC":{"t":"Section 204. Authority of the Commissioner to Compromise, Abate and Refund or Credit Taxes. - The Commissioner may -\n(A) Compromise the payment of any internal revenue tax, when:\n(1) A reasonable doubt as to the validity of the claim against the taxpayer exists; or\n(2) The financial position of the taxpayer demonstrates a clear inability to pay the assessed tax.","src":"NIRC (RA 8424)","u":"https://lawphil.net/statutes/repacts/ra1997/ra_8424_1997.html"},"Sec. 228, NIRC":{"t":"… Such assessment may be protested administratively by filing a request for reconsideration or reinvestigation within thirty (30) days from receipt of the assessment in such form and manner as may be prescribed by implementing rules and regulations.\nIf the protest is denied in whole or in part, or is not acted upon within one hundred eighty (180) days from submission of documents, the taxpayer adversely affected by the decision or inaction may appeal to the Court of Tax Appeals within thirty (30) days from receipt of the said decision, or from the lapse of one hundred eighty (180)-day period; otherwise, the decision shall become final, executory and demandable.","src":"NIRC (RA 8424)","u":"https://lawphil.net/statutes/repacts/ra1997/ra_8424_1997.html"},"Sec. 229, NIRC":{"t":"Section 229. Recovery of Tax Erroneously or Illegally Collected. - no suit or proceeding shall be maintained in any court for the recovery of any national internal revenue tax hereafter alleged to have been erroneously or illegally assessed or collected, or of any penalty claimed to have been collected without authority, of any sum alleged to have been excessively or in any manner wrongfully collected without authority, or of any sum alleged to have been excessively or in any manner wrongfully collected, until a claim for refund or credit has been duly filed with the Commissioner; but such suit or proceeding may be maintained, whether or not such tax, penalty, or sum has been paid under protest or duress.","src":"NIRC (RA 8424)","u":"https://lawphil.net/statutes/repacts/ra1997/ra_8424_1997.html"},"RCC, Sec. 10":{"t":"Section 10. Number and Qualifications of Incorporators. - Any person, partnership, association or corporation, singly or jointly with others but not more than fifteen (15) in number, may organize a corporation for any lawful purpose or purposes: Provided, That natural persons who are licensed to practice a profession, and partnerships or associations organized for the purpose of practicing a profession, shall not be allowed to organize as a corporation unless otherwise provided under special laws. Incorporators who are natural persons must be of legal age.","src":"Revised Corporation Code (RA 11232)","u":"https://lawphil.net/statutes/repacts/ra2019/ra_11232_2019.html"},"RCC, Sec. 38":{"t":"Section 38. Power to Deny Preemptive Right. - All stockholders of a stock corporation shall enjoy preemptive right to subscribe to all issues or disposition of shares of any class, in proportion to their respective shareholdings, unless such right is denied by the articles of incorporation or an amendment thereto: Provided, That such preemptive right shall not extend to shares issued in compliance with laws requiring stock offerings or minimum stock ownership by the public; or to shares issued in good faith with the approval of the stockholders representing two-thirds (2/3) of the outstanding capital stock in exchange for property needed for corporate purposes or in payment of previously contracted debt.","src":"Revised Corporation Code (RA 11232)","u":"https://lawphil.net/statutes/repacts/ra2019/ra_11232_2019.html"},"RCC, Sec. 80":{"t":"Section 80. When the Right of Appraisal May Be Exercised. - Any stockholder of a corporation shall have the right to dissent and demand payment of the fair value of the shares in the following instances:\n(a) In case an amendment to the articles of incorporation has the effect of changing or restricting the rights of any stockholder or class of shares, or of authorizing preferences in any respect superior to those of outstanding shares of any class, or of extending or shortening the term of corporate existence;\n(b) In case of sale, lease, exchange, transfer, mortgage, pledge or other disposition of all or substantially all of the corporate property and assets as provided in this Code;\n(c) In case of merger or consolidation; and\n(d) In case of investment of corporate funds for any purpose other than the primary purpose of the corporation.","src":"Revised Corporation Code (RA 11232)","u":"https://lawphil.net/statutes/repacts/ra2019/ra_11232_2019.html"},"NIL, Sec. 1":{"t":"Section 1. Form of negotiable instrument.-An instrument to be negotiable must conform to the following requirements:\n(a) It must be in writing and signed by the maker or drawer;\n(b) Must contain an unconditional promise or order to pay a sum certain in money;\n(c) Must be payable on demand, or at a fixed or determinable future time;\n(d) Must be payable to order or to bearer; and\n(e) Where the instrument is addressed to a drawee, he must be named or otherwise indicated therein with reasonable certainty.","src":"Negotiable Instruments Law (Act 2031)","u":"https://lawphil.net/statutes/acts/act1911/act_2031_1911.html"},"NIL, Sec. 29":{"t":"Section 29. Liability of accommodation party.-An accommodation party is one who has signed the instrument as maker, drawer, acceptor, or indorser, without receiving value therefor, and for the purpose of lending his name to some other person. Such a person is liable on the instrument to a holder for value, notwithstanding such holder at the time of taking the instrument knew him to be only an accommodation party.","src":"Negotiable Instruments Law (Act 2031)","u":"https://lawphil.net/statutes/acts/act1911/act_2031_1911.html"},"NIL, Sec. 52":{"t":"Section 52. What constitutes a holder in due course.- A holder in due course is a holder who has taken the instrument under the following conditions:\n(a) That it is complete and regular upon its face;\n(b) That he became the holder of it before it was overdue, and without notice that it had been previously dishonored, if such was the fact;\n(c) That he took it in good faith and for value;\n(d) That at the time it was negotiated to him he had no notice of any infirmity in the instrument or defect in the title of the person negotiating it.","src":"Negotiable Instruments Law (Act 2031)","u":"https://lawphil.net/statutes/acts/act1911/act_2031_1911.html"},"Ins. Code, Sec. 26":{"t":"Section 26. A neglect to communicate that which a party knows and ought to communicate, is called a concealment.","src":"Insurance Code as amended by RA 10607","u":"https://lawphil.net/statutes/repacts/ra2013/ra_10607_2013.html"},"LGC, Sec. 69":{"t":"Section 69. By Whom Exercised. - The power of recall for loss of confidence shall be exercised by the registered voters of a local government unit to which the local elective official subject to such recall belongs.","src":"Local Government Code (RA 7160)","u":"https://lawphil.net/statutes/repacts/ra1991/ra_7160_1991.html"},"RA 1405":{"t":"Section 2. All deposits of whatever nature with banks or banking institutions in the Philippines including investments in bonds issued by the Government of the Philippines, its political subdivisions and its instrumentalities, are hereby considered as of an absolutely confidential nature and may not be examined, inquired or looked into by any person, government official, bureau or office, except upon written permission of the depositor, or in cases of impeachment, or upon order of a competent court in cases of bribery or dereliction of duty of public officials, or in cases where the money deposited or invested is the subject matter of the litigation.","src":"RA 1405, as amended","u":"https://lawphil.net/statutes/repacts/ra1955/ra_1405_1955.html","note":"Sec. 2"},"RA 9160":{"t":"SEC. 4. Money Laundering Offense. – Money laundering is committed by any person who, knowing that any monetary instrument or property represents, involves, or relates to the proceeds of any unlawful activity: …","src":"RA 9160 as amended by RA 10365","u":"https://lawphil.net/statutes/repacts/ra2013/ra_10365_2013.html","note":"Sec. 4, as amended by RA 10365"},"RA 7080":{"t":"Sec. 2. Definition of the Crime of Plunder; Penalties. - Any public officer who, by himself or in connivance with members of his family, relatives by affinity or consanguinity, business associates, subordinates or other persons, amasses, accumulates or acquires ill-gotten wealth through a combination or series of overt criminal acts as described in Section 1 (d) hereof in the aggregate amount or total value of at least Fifty million pesos (P50,000,000.00) shall be guilty of the crime of plunder and shall be punished by reclusion perpetua to death. Any person who participated with the said public officer in the commission of an offense contributing to the crime of plunder shall likewise be punished for such offense. …","src":"RA 7659, amending the RPC","u":"https://lawphil.net/statutes/repacts/ra1993/ra_7659_1993.html","note":"Sec. 2, as amended by RA 7659"},"RA 8799":{"t":"3.1. \"Securities\" are shares, participation or interests in a corporation or in a commercial enterprise or profit-making venture and evidenced by a certificate, contract, instruments, whether written or electronic in character.","src":"Securities Regulation Code (RA 8799)","u":"https://lawphil.net/statutes/repacts/ra2000/ra_8799_2000.html","note":"Sec. 3.1"},"RA 10142":{"t":"(gg) Rehabilitation shall refer to the restoration of the debtor to a condition of successful operation and solvency, if it is shown that its continuance of operation is economically feasible and its creditors can recover by way of the present value of payments projected in the plan, more if the debtor continues as a going concern than if it is immediately liquidated.","src":"FRIA (RA 10142)","u":"https://lawphil.net/statutes/repacts/ra2010/ra_10142_2010.html","note":"Sec. 4(gg)"},"PD 115":{"t":"Section 4. What constitutes a trust receipt transaction. A trust receipt transaction, within the meaning of this Decree, is any transaction by and between a person referred to in this Decree as the entruster, and another person referred to in this Decree as entrustee, whereby the entruster, who owns or holds absolute title or security interests over certain specified goods, documents or instruments, releases the same to the possession of the entrustee upon the latter's execution and delivery to the entruster of a signed document called a \"trust receipt\" wherein the entrustee binds himself to hold the designated goods, documents or instruments in trust for the entruster and to sell or otherwise dispose of the goods, documents or instruments with the obligation to turn over to the entruster the proceeds thereof to the extent of the amount owing to the entruster or as appears in the trust r …","src":"Trust Receipts Law (PD 115)","u":"https://lawphil.net/statutes/presdecs/pd1973/pd_115_1973.html"},"PD 1612":{"t":"Section 2. Definition of Terms. The following terms shall mean as follows:\n(a) \"Fencing\" is the act of any person who, with intent to gain for himself or for another, shall buy, receive, possess, keep, acquire, conceal, sell or dispose of, or shall buy and sell, or in any other manner deal in any article, item, object or anything of value which he knows, or should be known to him, to have been derived from the proceeds of the crime of robbery or theft.","src":"Anti-Fencing Law (PD 1612)","u":"https://lawphil.net/statutes/presdecs/pd1979/pd_1612_1979.html"},"PD 968":{"t":"Section 3. Meaning of Terms. As used in this Decree, the following shall, unless the context otherwise requires, be construed thus:\n(a) \"Probation\" is a disposition under which a defendant, after conviction and sentence, is released subject to conditions imposed by the court and to the supervision of a probation officer.","src":"Probation Law (PD 968)","u":"https://lawphil.net/statutes/presdecs/pd1976/pd_968_1976.html"},"Act 4103":{"t":"Section 1. Hereafter, in imposing a prison sentence for an offense punished by acts of the Philippine Legislature, otherwise than by the Revised Penal Code, the court shall order the accused to be imprisoned for a minimum term, which shall not be less than the minimum term of imprisonment provided by law for the offense, and for a maximum term which shall not exceed the maximum fixed by law; and where the offense is punished by the Revised Penal Code, or amendments thereto, the court shall sentence the accused to such maximum as may, in view of attending circumstances, be properly imposed under the present rules of the said Code, and to a minimum which shall not be less than the minimum imprisonment period of the penalty next lower to that prescribed by said Code for the offense. …","src":"Indeterminate Sentence Law (Act 4103)","u":"https://lawphil.net/statutes/acts/act1933/act_4103_1933.html"},"RA 9165, Sec. 21":{"t":"… (1) The apprehending team having initial custody and control of the dangerous drugs, controlled precursors and essential chemicals, instruments/paraphernalia and/or laboratory equipment shall, immediately after seizure and confiscation, conduct a physical inventory of the seized items and photograph the same in the presence of the accused or the person/s from whom such items were confiscated and/or seized, or his/her representative or counsel, with an elected public official and a representative of the National Prosecution Service or the media who shall be required to sign the copies of the inventory and be given a copy thereof: Provided, That the physical inventory and photograph shall be conducted at the place where the search warrant is served; …","src":"RA 9165 Sec. 21 as amended by RA 10640","u":"https://lawphil.net/statutes/repacts/ra2014/ra_10640_2014.html","note":"As amended by RA 10640"},"RA 11210":{"t":"Section 3. Grant of Maternity Leave.— All covered female workers in government and the private sector, including those in the informal economy, regardless of civil status or the legitimacy of her child, shall be granted one hundred five (105) days maternity leave with full pay and an option to extend for an additional thirty (30) days without pay: Provided, That in case the worker qualifies as a solo parent under Republic Act No. 8972, or the \"Solo Parents’ Welfare Act\", the worker shall be granted an additional fifteen (15) days maternity leave with full pay.\nEnjoyment of maternity leave cannot be deferred but should be availed of either before or after the actual period of delivery in a continuous and uninterrupted manner, not exceeding one hundred five (105) days, as the case may be.","src":"105-Day Expanded Maternity Leave Law (RA 11210)","u":"https://lawphil.net/statutes/repacts/ra2019/ra_11210_2019.html"},"RA 8187":{"t":"Section 2. Notwithstanding any law, rules and regulations to the contrary, every married male employee in the private and public sectors shall be entitled to a paternity leave of seven (7) days with full pay for the first four (4) deliveries of the legitimate spouse with whom he is cohabiting. The male employee applying for paternity leave shall notify his employer of the pregnancy of his legitimate spouse and the expected date of such delivery. For purposes of this Act, delivery shall include childbirth or any miscarriage.","src":"Paternity Leave Act (RA 8187)","u":"https://lawphil.net/statutes/repacts/ra1996/ra_8187_1996.html"},"PD 851":{"t":"Section 1. All employers are hereby required to pay all their employees receiving a basic salary of not more than P1,000 a month, regardless of the nature of their employment, a 13th-month pay not later than December 24 of every year.","src":"13th-Month Pay Law (PD 851)","u":"https://lawphil.net/statutes/presdecs/pd1975/pd_851_1975.html","note":"The P1,000 salary ceiling was later removed by Memorandum Order No. 28 (1986)"},"Rule 9":{"t":"Section 3. Default; declaration of. — If the defending party fails to answer within the time allowed therefor, the court shall, upon motion of the claiming party with notice to the defending party, and proof of such failure, declare the defending party in default. Thereupon, the court shall proceed to render judgment granting the claimant such relief as his pleading may warrant, unless the court in its discretion requires the claimant to submit evidence. Such reception of evidence may be delegated to the clerk of court. (1a, R18)\n(a) Effect of order of default. — A party in default shall be entitled to notice of subsequent proceedings but not to take part in the trial. (2a, R18)\n(b) Relief from order of default. …"
